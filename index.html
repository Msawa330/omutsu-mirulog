<style>
  :root{
    --bg:#131e36; --panel:#27375e; --text:#ffffff; --sub:#b9c3d9;
    --divider:rgba(255,255,255,0.14);
    --pee:#6e93b8; --poop:#9a7e6d; --breast:#de9aa4;
    --milk-bg:#fde08a; --accent:#ffd94d; --dark:#1d2a47; --past:#7dd3fc; --cal:#e8c87a;
    --coral:#ff8a75;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; overflow-x:hidden; max-width:100%;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--panel); color:var(--text);
    font-family:"M PLUS Rounded 1c",system-ui,-apple-system,"Hiragino Maru Gothic ProN",sans-serif;
    font-weight:500; min-height:100vh; overflow-x:hidden; width:100%;
  }
  svg,img{max-width:100%;}
  input,select,textarea{max-width:100%; min-width:0;}
  button{font-family:inherit; cursor:pointer; border:none; color:inherit;}
  button:disabled{opacity:.45; cursor:not-allowed;}
  .wrap{max-width:672px; width:100%; margin:0 auto; padding:calc(env(safe-area-inset-top, 0px) + 4px) 12px 32px; overflow-x:clip;}

  /* ===== header (パネルの外) ===== */
  .now-row{position:relative; margin:0 0 4px; min-height:26px; display:flex; align-items:center; justify-content:center; min-width:0;}
  .now{font-size:13px; text-align:center; color:var(--text); margin:0; font-weight:500; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; line-height:1.2;}
  .btn-reload{position:absolute; left:0; top:50%; transform:translateY(-50%); padding:4px 10px; font-size:11px; white-space:nowrap;}
  .topbar{display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:3px;}
  .btn-signin{
    background:#ffffff; color:var(--dark); font-weight:800; font-size:14px;
    border-radius:999px; padding:9px 18px; display:inline-flex; align-items:center; gap:8px;
  }
  .btn-ghost{
    background:transparent; color:var(--sub); font-weight:700; font-size:13px;
    border:1px solid var(--divider); border-radius:999px; padding:8px 14px;
  }
  .signed{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--sub);}
  .signed .dot{width:8px;height:8px;border-radius:50%;background:#7ee2a0;display:inline-block;}
  .authbar{display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap;}
  .status{font-size:13px; color:var(--sub); text-align:center; min-height:18px; margin:0 0 2px;}
  .status:empty{min-height:0; margin:0;}
  .status.err{color:#ff9d9d;}

  /* ===== panels ===== */
  .panel{background:var(--bg); border-radius:14px; padding:6px 12px; margin-bottom:6px; min-width:0; max-width:100%;}
  .prevrow{display:flex; align-items:center; gap:6px; padding:1px 0 4px; min-height:22px; flex-wrap:nowrap; overflow:hidden; min-width:0; max-width:100%;}
  .prevrow .plabel{font-size:12px; color:var(--sub); font-weight:700; flex:0 0 auto;}
  .prevrow .elapsed{font-size:14px; font-weight:800; line-height:1.1; flex:0 1 auto; white-space:nowrap; min-width:0;}
  .prevrow .none{font-size:13px; color:var(--sub);}

  .diaper-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px; min-width:0;}
  .d-btn{
    min-width:0; border-radius:24px; padding:4px 6px; min-height:68px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-size:20px; font-weight:800; color:#fff;
  }
  .d-btn svg{width:36px; height:36px;}
  .d-btn.pee{background:var(--pee);}
  .d-btn.poop{background:var(--poop);}
  .d-btn:active{filter:brightness(1.12);}

  .feed-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-template-rows:54px 54px; gap:6px; min-width:0;}
  .f-breast{
    min-width:0; grid-row:1 / span 2; background:var(--breast); color:var(--dark);
    border-radius:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    font-size:18px; font-weight:800;
  }
  .f-breast svg{width:40px; height:40px;}
  .f-milk{
    min-width:0; padding:2px; background:var(--milk-bg); color:var(--dark); border-radius:18px;
    font-size:17px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .f-milk small{font-size:12px; font-weight:700; margin-left:1px;}
  .f-milk:active,.f-breast:active{filter:brightness(1.07);}

  /* ===== sections ===== */
  .sec-head{display:flex; align-items:center; gap:7px; margin:6px 2px 3px; font-size:13px; font-weight:700; color:var(--sub);}
  .sec-head svg{width:20px; height:20px;}
  .sec-head .spacer{flex:1;}
  .milk-total{display:inline-flex; align-items:center; gap:5px; color:var(--accent); font-weight:800; font-size:15px;}
  .milk-total svg{width:22px; height:22px;}

  .rec-list{display:flex; flex-direction:column;}
  .rec-row{
    display:flex; align-items:center; gap:10px; width:100%; max-width:100%; min-width:0; text-align:left;
    background:transparent; padding:5px 2px; border-bottom:1px solid var(--divider);
  }
  .rec-row:last-child{border-bottom:none;}
  .badge{flex:0 0 auto; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .badge svg{width:20px; height:20px;}
  .badge.pee{background:var(--pee);} .badge.poop{background:var(--poop);}
  .badge.breast{background:var(--breast);}
  .badge.milk{background:var(--milk-bg);}
  .badge.memo{background:#8494ab;}
  .rec-title{font-size:14px; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rec-time{font-size:16px; font-weight:800; white-space:nowrap;}
  .rec-time .pdate{color:var(--past); font-weight:800; margin-right:5px;}
  .rec-time.past{color:var(--past);}
  .empty{font-size:14px; color:var(--sub); padding:5px 2px;}

  /* ===== メモ入力 ===== */
  .memo-row{display:flex; gap:8px; align-items:center; padding:4px 0;}
  .memo-row input{
    flex:1; min-width:0; background:var(--panel); border:1px solid var(--divider); border-radius:10px;
    color:var(--text); font-size:16px; padding:10px 12px; font-family:inherit; color-scheme:dark;
  }
  .memo-btn{
    flex:0 0 auto; background:var(--accent); color:var(--dark); font-weight:800; font-size:14px;
    border-radius:10px; padding:11px 16px;
  }
  .memo-btn:disabled{opacity:.45;}

  /* ===== 7 days ===== */
  .day-row{
    display:grid; grid-template-columns:3.4rem repeat(4,minmax(0,1fr)); align-items:center; min-width:0;
  }
  .day-row>*{min-width:0;}
  .day-row{
    width:100%; background:transparent; text-align:center; padding:5px 2px;
    border-bottom:1px solid var(--divider); font-size:15px; font-weight:700; color:var(--text);
  }
  .day-row:last-child{border-bottom:none;}
  .day-row:active{background:rgba(255,255,255,0.06);}
  .day-row .dcell{text-align:left; line-height:1.25; padding-left:2px;}
  .day-row .dcell .md{font-size:15px; font-weight:800; display:block;}
  .day-row .dcell .wd{font-size:12px; color:var(--sub); font-weight:700; display:block;}
  .day-row .dcell .wline{font-size:10.5px; color:var(--text); font-weight:700; display:block; white-space:nowrap; letter-spacing:-0.03em; margin-top:1px;}
  .day-row .dcell .wline .wdiff{color:var(--sub); font-weight:700;}
  .day-row .dcell .wline .wdiff.neg{color:var(--coral);}
  .day-row .num{text-align:center;}
  .day-row .hl{color:var(--accent); font-weight:800;}

  /* ===== 月間のログ ===== */
  .month-row{
    display:grid; grid-template-columns:7rem repeat(3,minmax(0,1fr)); gap:12px; align-items:center; min-width:0;
    width:100%; background:transparent; text-align:left;
    padding:5px 2px; border-bottom:1px solid var(--divider); color:var(--text);
  }
  .month-row:last-child{border-bottom:none;}
  .month-row:active{background:rgba(255,255,255,0.06);}
  .month-row .month-name{font-size:15px; font-weight:800; white-space:nowrap; min-width:0;}
  .month-row .mvalue{font-size:15px; font-weight:800; white-space:nowrap; min-width:0; text-align:center;}

  /* ===== 列見出しアイコン行（7日間・月間 共通） ===== */
  .days-head{
    display:grid; grid-template-columns:3.4rem repeat(4,minmax(0,1fr)); align-items:center; min-width:0;
    padding:1px 2px 4px; border-bottom:1px solid var(--divider);
  }
  .days-head .hcell{display:flex; align-items:center; justify-content:center; min-width:0;}
  .days-head svg{width:22px; height:22px;}
  .months-head{
    display:grid; grid-template-columns:7rem repeat(3,minmax(0,1fr)); gap:12px; align-items:center; min-width:0;
    padding:1px 2px 4px; border-bottom:1px solid var(--divider);
  }
  .months-head .hcell{display:flex; align-items:center; justify-content:center; min-width:0;}
  .months-head .hcell:first-child{justify-content:flex-start;}
  .months-head svg{width:24px; height:24px; flex:0 0 auto;}
  .months-head .hcell.ic-diaper svg{width:24px; height:24px;}

  /* ===== setup / guide panels ===== */
  .card{background:var(--panel); border-radius:20px; padding:16px; margin-bottom:12px;}
  .card h2{font-size:16px; font-weight:800; margin:0 0 8px;}
  .card p{font-size:13.5px; line-height:1.7; color:var(--sub); margin:0 0 10px;}
  .card ol{font-size:13.5px; line-height:1.8; color:var(--sub); margin:0 0 6px; padding-left:20px;}
  .card label{display:block; font-size:13px; font-weight:700; margin:12px 0 5px;}
  .card input{
    width:100%; background:var(--bg); border:1px solid var(--divider); border-radius:10px;
    color:var(--text); font-size:16px; padding:10px 12px; font-family:inherit;
  }
  .btn-primary{
    background:var(--accent); color:var(--dark); font-weight:800; font-size:15px;
    border-radius:12px; padding:11px 18px; width:100%; margin-top:14px;
  }
  .btn-sub{
    background:transparent; color:var(--sub); font-weight:700; font-size:13px;
    border:1px solid var(--divider); border-radius:10px; padding:9px 14px; width:100%; margin-top:8px;
  }
  .btn-more{
    display:block; width:50%; margin:3px auto 3px;
    background:var(--bg); color:var(--text); font-weight:700; font-size:13px;
    border:1px solid var(--divider); border-radius:999px; padding:7px 14px;
  }
  .btn-more:active{background:#232f4f;}
  .hidden{display:none !important;}

  /* ===== 週間ビューワー ===== */
  .viewer-sheet{display:flex; flex-direction:column; max-height:92vh;}
  .viewer-scroll{
    overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    background:var(--bg); border:1px solid var(--divider); border-radius:14px;
    max-height:calc(92vh - 150px); min-width:0;
    overscroll-behavior:contain; touch-action:pan-y;
  }
  /* ===== ビューワー表示中は背景ページをロックする ===== */
  html.viewer-locked, body.viewer-locked{overflow:hidden !important; overscroll-behavior:none;}
  body.viewer-locked{position:fixed; left:0; right:0; width:100%;}
  #viewerOverlay{overscroll-behavior:none;}
  .viewer-sheet{overscroll-behavior:contain;}
  .viewer-nav{display:flex; gap:8px; margin-top:12px;}
  .viewer-nav .btn-sub{margin-top:0; flex:1 1 0; width:auto; padding:9px 4px; font-size:13px; white-space:nowrap;}
  .viewer-nav .viewer-close{flex:1.2 1 0; font-weight:800; color:var(--text);}
  .viewer-grid{display:grid; grid-template-columns:2.3rem repeat(7,minmax(0,1fr)); min-width:0;}
  .v-head{
    position:sticky; top:0; z-index:3; background:var(--dark);
    text-align:center; padding:6px 1px 5px; border-bottom:1px solid rgba(255,255,255,.3);
    line-height:1.2; min-width:0;
  }
  .v-head .v-md{display:block; font-size:12px; font-weight:800; white-space:nowrap;}
  .v-head .v-wd{display:block; font-size:10px; font-weight:700; color:var(--sub); white-space:nowrap;}
  .v-head .v-w{display:block; font-size:10px; font-weight:700; white-space:nowrap; line-height:1.2; min-height:1.2em; margin-top:1px;}
  .v-head.today .v-md,.v-head.today .v-wd,.v-head.today .v-w{color:var(--accent);}
  .v-corner{position:sticky; top:0; z-index:3; background:var(--dark); border-bottom:1px solid rgba(255,255,255,.3);}
  .v-time{
    font-size:10px; font-weight:700; color:var(--sub); text-align:right;
    padding:2px 4px 0 0; line-height:1.1; min-width:0; white-space:nowrap;
  }
  .v-time.hour{border-top:1px solid rgba(255,255,255,.30);}
  .v-slot{
    min-height:26px; padding:1px 1px; display:flex; flex-direction:column; gap:2px;
    border-left:1px solid rgba(255,255,255,.07); min-width:0;
  }
  .v-slot.hour{border-top:1px solid rgba(255,255,255,.30);}
  .v-slot.today{background:rgba(255,217,77,.05);}
  .v-chip{
    width:100%; min-width:0; border-radius:6px; padding:2px 1px;
    display:flex; align-items:center; justify-content:center; gap:1px;
    font-size:9px; font-weight:800; line-height:1.15; white-space:nowrap; overflow:hidden;
  }
  .v-chip svg{width:13px; height:13px; flex:0 0 auto;}
  .v-chip span{overflow:hidden; text-overflow:ellipsis;}
  .v-chip.pee{background:var(--pee); color:#fff;}
  .v-chip.poop{background:var(--poop); color:#fff;}
  .v-chip.breast{background:var(--breast); color:var(--dark);}
  .v-chip.milk{background:var(--milk-bg); color:var(--dark);}
  .v-chip:active{filter:brightness(1.12);}
  @media (max-width:430px){
    .viewer-grid{grid-template-columns:2rem repeat(7,minmax(0,1fr));}
    .v-head .v-md{font-size:11px;}
    .v-chip{font-size:8.5px;}
    .v-chip svg{width:12px; height:12px;}
  }

  /* ===== modals ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(5,10,24,.66); z-index:50;
    display:flex; align-items:flex-end; justify-content:center; overflow-x:hidden; max-width:100%;
  }
  .sheet{
    background:var(--panel); width:100%; max-width:672px; min-width:0; max-height:86vh; overflow-y:auto; overflow-x:hidden;
    border-radius:24px 24px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .sheet h3{font-size:16px; font-weight:800; margin:0 0 12px; display:flex; align-items:center; gap:8px;}
  .sheet h3 svg{width:24px; height:24px;}
  .sheet .close-x{margin-left:auto; background:transparent; color:var(--sub); font-size:20px; line-height:1; padding:4px 8px;}
  .sheet label{display:block; font-size:13px; font-weight:700; color:var(--sub); margin:10px 0 6px;}
  .sheet input[type="datetime-local"]{
    width:100%; background:var(--bg); border:1px solid var(--divider); border-radius:10px;
    color:var(--text); font-size:16px; padding:10px 12px; font-family:inherit; color-scheme:dark;
  }
  .sheet input[type="text"]{
    width:100%; background:var(--bg); border:1px solid var(--divider); border-radius:10px;
    color:var(--text); font-size:16px; padding:10px 12px; font-family:inherit; color-scheme:dark;
  }
  .preset-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .preset{
    background:var(--bg); color:var(--text); border:1px solid var(--divider);
    border-radius:999px; padding:8px 13px; font-size:13px; font-weight:700;
  }
  .opt-row{display:flex; gap:8px; flex-wrap:wrap;}
  .opt{
    display:inline-flex; align-items:center; gap:6px; border-radius:14px; padding:10px 14px;
    font-size:15px; font-weight:800; border:2px solid transparent; background:var(--bg); color:var(--text);
  }
  .opt svg{width:22px; height:22px;}
  .opt.sel{border-color:#fff;}
  .opt.pee{background:var(--pee); color:#fff;}
  .opt.poop{background:var(--poop); color:#fff;}
  .opt.milk{background:var(--milk-bg); color:var(--dark);}
  .milk-custom{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .milk-custom input{
    flex:1; min-width:0; background:var(--bg); border:1px solid var(--divider); border-radius:10px;
    color:var(--text); font-size:16px; padding:10px 12px; font-family:inherit; color-scheme:dark;
  }
  .milk-custom .milk-unit{font-size:15px; font-weight:800; color:var(--text); flex:0 0 auto;}
  .sheet .btn-primary{margin-top:18px;}
  .btn-danger{
    background:transparent; color:#ff9d9d; border:1px solid rgba(255,157,157,.5);
    font-weight:800; font-size:14px; border-radius:12px; padding:11px 18px; width:100%; margin-top:10px;
  }
  .btn-danger.confirm{background:#c0392b; color:#fff; border-color:#c0392b;}
  .day-total{display:flex; gap:14px; flex-wrap:wrap; font-size:13.5px; color:var(--sub); margin-bottom:8px; font-weight:700;}
  .day-total:empty{display:none;}
  .day-total .hl{color:var(--accent); font-weight:800;}
  .day-total .neg{color:var(--coral); font-weight:800;}
  footer{margin-top:16px; text-align:center;}

  /* ===== 赤ちゃん設定ブロック ===== */
  .baby-bar{padding:6px 12px;}
  .baby-bar-row{display:flex; align-items:center; gap:10px; min-width:0;}
  .baby-bar-row .baby-summary{flex:1; min-width:0; font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .baby-bar-row .baby-summary .unset{color:var(--sub); font-weight:700;}
  .baby-bar-row .btn-ghost{flex:0 0 auto; background:transparent; color:var(--sub); font-weight:700; font-size:13px; border:1px solid var(--divider); border-radius:999px; padding:8px 14px;}
  .baby-bar-row .btn-weight-record{white-space:nowrap;}
  .baby-bar-row .btn-weight-record.recorded{color:#7ee2a0; border-color:rgba(126,226,160,.6);}
  .baby-weight-display{font-weight:800; color:inherit;}
  /* TOPの体重は、その場（赤ちゃん設定ブロック内）で編集する */
  .top-weight-editor{margin-top:8px;}
  .top-weight-editor input{
    width:100%; background:var(--panel); border:1px solid var(--divider); border-radius:10px;
    color:var(--text); font-size:16px; padding:10px 12px; font-family:inherit; color-scheme:dark;
  }
  .top-weight-editor .btn-primary{margin-top:8px;}
  .set-editor .btn-primary{margin-top:8px;}

  /* ===== 前回行の次回目安 ===== */
  .prevrow .next-time{margin-left:auto; flex:0 1 auto; min-width:0; color:var(--accent); font-size:13px; font-weight:800; white-space:nowrap; padding-left:6px; display:inline-flex; align-items:center; gap:4px;}
  .prevrow .next-time .next-bell{flex:0 0 auto; width:15px; height:15px; display:inline-flex; align-items:center; justify-content:center; color:var(--accent);}
  .prevrow .next-time .next-bell svg{width:15px; height:15px;}

  /* ===== おすすめバッジ（哺乳瓶） ===== */
  .f-milk{position:relative;}
  .rec-badge{
    position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%;
    background:var(--panel); color:var(--milk-bg); display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .rec-badge svg{width:13px; height:13px;}

  /* ===== 今日のミルク ゲージ ===== */
  .gauge-head{font-size:13px; font-weight:700; margin:6px 2px 3px; color:var(--sub); display:flex; align-items:baseline; gap:8px;}
  .gauge-bar{
    display:flex; height:26px; border-radius:10px; overflow:hidden; background:#3a4152; max-width:100%; min-width:0;
  }
  .gauge-foot>span{min-width:0;}
  .gauge-seg{
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    font-size:11px; font-weight:800; white-space:nowrap; min-width:0;
  }
  .gauge-seg.milk{background:var(--accent); color:var(--dark);}
  .gauge-foot{display:flex; justify-content:space-between; align-items:baseline; margin-top:3px; font-size:12px; font-weight:700; color:var(--text);}
  .gauge-foot .over{color:var(--accent); font-weight:800;}

  /* ===== 赤ちゃん設定シート ===== */
  .set-row{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    background:var(--bg); border:1px solid var(--divider); border-radius:14px;
    padding:9px 12px; margin-top:6px; font-size:15px;
  }
  .set-row .set-label{font-weight:700; color:var(--text); flex:0 0 auto;}
  .set-row .set-value{flex:1; min-width:0; text-align:right; font-weight:800; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .set-row .set-value.unset{color:var(--sub); font-weight:700;}
  .set-row .set-chev{color:var(--sub); font-size:20px; line-height:1; flex:0 0 auto;}
  .set-editor{margin-top:6px;}
  .set-editor input{
    width:100%; background:var(--bg); border:1px solid var(--divider); border-radius:10px;
    color:var(--text); font-size:16px; padding:9px 12px; font-family:inherit; color-scheme:dark;
  }
  .guide-box{background:var(--bg); border:1px solid var(--divider); border-radius:16px; padding:10px 14px; margin-top:6px;}
  .guide-box .guide-title{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:800; margin-bottom:6px;}
  .guide-box .guide-title .gicon{width:24px; height:24px; color:var(--milk-bg); display:inline-flex;}
  .guide-box .guide-title .gicon svg{width:24px; height:24px;}
  .guide-box .guide-line{font-size:16px; font-weight:800; line-height:1.5; overflow-wrap:anywhere;}
  .age-table{margin-top:6px; border:1px solid var(--divider); border-radius:16px; overflow:hidden; max-width:100%;}
  .age-row{display:flex; gap:10px; padding:8px 14px; background:var(--bg); border-bottom:1px solid var(--divider); font-size:13.5px; align-items:center; min-width:0; width:100%; text-align:left; font-family:inherit; cursor:pointer;}
  .age-row:last-child{border-bottom:none;}
  .age-row .age-label{color:#b9c2d0; font-weight:700; flex:0 1 6.2em; min-width:0;}
  .age-row .age-value{color:#fff; font-weight:700; flex:1; min-width:0; overflow-wrap:anywhere;}
  .age-row.sel{background:rgba(255,217,77,.18);}
  .age-row.sel .age-label{color:var(--accent);}
  .age-row.sel .age-value{color:var(--accent);}
  .age-rec{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%;
    background:var(--panel); color:var(--milk-bg); display:inline-flex; align-items:center; justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .age-rec svg{width:14px; height:14px;}
  .goal-inputs{display:flex; gap:8px;}
  .goal-field{flex:1 1 0; min-width:0; display:flex; align-items:center; gap:6px;}
  .goal-field input{flex:1; min-width:0;}
  .goal-field .goal-unit{flex:0 0 auto; font-size:14px; font-weight:800; color:var(--sub);}
  .toggle-row{display:flex; align-items:center; gap:10px; margin-top:6px; background:var(--bg); border:1px solid var(--divider); border-radius:14px; padding:9px 12px;}
  .toggle-row .t-label{flex:1; min-width:0; font-size:15px; font-weight:700;}
  .toggle-row .t-state{font-size:13px; color:var(--sub); font-weight:700;}
  .switch{
    flex:0 0 auto; width:50px; height:28px; border-radius:999px; background:#3a4152; position:relative; padding:0;
  }
  .switch .knob{
    position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff;
    transition:left .15s ease;
  }
  .switch.on{background:#7ee2a0;}
  .switch.on .knob{left:25px;}
  .sheet .conn-box{background:var(--bg); border:1px solid var(--divider); border-radius:16px; padding:10px 14px; margin-top:6px;}
  .sheet .conn-box h4{font-size:14px; font-weight:800; margin:0 0 6px;}
  .sheet .conn-box label{margin:10px 0 5px;}
  .sheet .conn-box input{
    width:100%; background:var(--panel); border:1px solid var(--divider); border-radius:10px;
    color:var(--text); font-size:16px; padding:10px 12px; font-family:inherit;
  }
  .sheet-sec-label{font-size:13px; font-weight:700; color:var(--sub); margin:12px 0 0;}

  /* ===== 狭幅端末（〜430px）：はみ出し防止のサイズ調整 ===== */
  @media (max-width:430px){
    .wrap{padding:calc(env(safe-area-inset-top, 0px) + 2px) 10px 28px;}
    .panel{padding:5px 10px; border-radius:12px;}
    .baby-bar{padding:5px 10px;}
    .now{font-size:12px;}
    .btn-reload{padding:3px 8px; font-size:11px;}
    .baby-bar-row{gap:6px;}
    .baby-bar-row .baby-summary{font-size:13.5px;}
    .baby-bar-row .btn-ghost{padding:7px 10px; font-size:12px;}
    .prevrow{gap:5px;}
    .prevrow .plabel{font-size:11px;}
    .prevrow .elapsed{font-size:12px;}
    .prevrow .next-time{font-size:12px; padding-left:4px; gap:3px;}
    .prevrow .next-time .next-bell{width:13px; height:13px;}
    .prevrow .next-time .next-bell svg{width:13px; height:13px;}
    .diaper-grid{gap:5px;}
    .d-btn{font-size:18px; min-height:64px; border-radius:20px;}
    .d-btn svg{width:32px; height:32px;}
    .feed-grid{gap:5px; grid-template-rows:50px 50px;}
    .f-breast{font-size:16px; border-radius:20px;}
    .f-breast svg{width:34px; height:34px;}
    .f-milk{font-size:15px; border-radius:16px;}
    .f-milk small{font-size:11px;}
    .rec-badge{width:18px; height:18px; top:3px; right:3px;}
    .gauge-seg{font-size:10px;}
    .day-row{font-size:14px; padding:5px 0;}
    .month-row .mvalue{font-size:14px;}
    .month-row .month-name{font-size:14px;}
    .month-row{grid-template-columns:6.4rem repeat(3,minmax(0,1fr)); gap:8px;}
    .months-head{grid-template-columns:6.4rem repeat(3,minmax(0,1fr)); gap:8px;}
    .sheet{padding:16px 12px calc(16px + env(safe-area-inset-bottom));}
    .set-row{font-size:14px; padding:9px 10px;}
    .age-row{padding:8px 10px; gap:8px;}
    .toggle-row{padding:9px 10px;}
    .toggle-row .t-label{font-size:14px;}
    .opt{padding:9px 11px; font-size:14px;}
    .day-total{gap:10px;}
  }
  @media (max-width:360px){
    .now{font-size:11px;}
    .prevrow .elapsed{font-size:11px;}
    .prevrow .next-time{font-size:11px;}
    .f-milk{font-size:14px;}
    .day-row{grid-template-columns:2.9rem repeat(4,minmax(0,1fr));}
    .days-head{grid-template-columns:2.9rem repeat(4,minmax(0,1fr));}
    .month-row{grid-template-columns:5.9rem repeat(3,minmax(0,1fr)); gap:6px;}
    .months-head{grid-template-columns:5.9rem repeat(3,minmax(0,1fr)); gap:6px;}
    .month-row .month-name{font-size:13px;}
    .day-row .dcell .md{font-size:14px;}
    .day-row .dcell .wline{font-size:9.5px;}
    .age-row .age-label{flex-basis:5.4em;}
    .rec-title{font-size:13px;}
    .rec-time{font-size:15px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="now-row">
    <p class="now" id="nowLine">—</p>
    <button class="btn-ghost btn-reload hidden" id="reloadBtn" type="button">再読み込み</button>
  </div>

  <!-- 赤ちゃん設定ブロック -->
  <section class="panel baby-bar" aria-label="赤ちゃん設定">
    <div class="baby-bar-row">
      <span class="baby-summary" id="babySummary"><span class="unset">赤ちゃん設定を入力</span></span>
      <button class="btn-ghost btn-weight-record" id="weightRecordBtn" type="button">体重を記録</button>
      <button class="btn-ghost" id="babySettingsBtn" type="button">設定</button>
    </div>
    <div class="top-weight-editor hidden" id="topWeightEditor">
      <input type="number" id="inputWeightTop" inputmode="numeric" min="500" max="20000" step="10" placeholder="例：3800" aria-label="現在の体重（g）">
      <button class="btn-primary" id="weightSaveBtn" type="button">保存する</button>
      <button class="btn-sub" id="weightCloseBtn" type="button">キャンセル</button>
    </div>
  </section>

  <div class="topbar" id="topbar">
    <button class="btn-signin hidden" id="signinBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.5 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.5 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Googleでサインイン
    </button>
  </div>
  <p class="status" id="status"></p>

  <!-- おむつパネル -->
  <section class="panel" aria-label="おむつ">
    <div class="prevrow" id="prevDiaper"></div>
    <div class="diaper-grid">
      <button class="d-btn pee rec-btn" id="btnPee" type="button" disabled></button>
      <button class="d-btn poop rec-btn" id="btnPoop" type="button" disabled></button>
    </div>
  </section>

  <!-- 授乳パネル -->
  <section class="panel" aria-label="授乳">
    <div class="prevrow" id="prevFeed"></div>
    <div class="feed-grid" id="feedGrid"></div>
  </section>

  <!-- 今日のミルク ゲージ -->
  <div class="gauge-head" id="gaugeHead"><span>今日のミルク</span></div>
  <section class="panel" id="milkGaugeWrap" aria-label="今日のミルク">
    <div class="gauge-bar" id="gaugeBar"></div>
    <div class="gauge-foot"><span id="gaugeTotal">0ml</span><span id="gaugeGoal">目標 400ml</span></div>
  </section>

  <!-- 今日のログ -->
  <div class="sec-head">
    <span>今日のログ</span>
  </div>
  <section class="panel" aria-label="今日のログ">
    <div class="rec-list" id="todayList"></div>
  </section>

  <!-- メモ入力 -->
  <section class="panel" aria-label="メモ">
    <div class="memo-row">
      <input type="text" id="memoInput" placeholder="メモ" aria-label="メモ" autocomplete="off">
      <button class="memo-btn" id="memoAddBtn" type="button">書き込む</button>
    </div>
  </section>

  <!-- 7日間のログ -->
  <div class="sec-head">
    <span>7日間のログ</span>
  </div>
  <section class="panel" aria-label="7日間のログ">
    <div id="daysBody"></div>
  </section>
  <button class="btn-more" id="viewerBtn" type="button">ビューワーで見る</button>

  <!-- 月間のログ -->
  <div class="sec-head">
    <span>月間のログ</span>
  </div>
  <section class="panel" aria-label="月間のログ">
    <div id="monthsBody"></div>
  </section>
  <button class="btn-more" id="allMonthsBtn" type="button">もっと見る</button>

  <footer>
    <div class="authbar">
      <span class="signed hidden" id="signedBox"><span class="dot"></span>サインイン中</span>
      <button class="btn-ghost hidden" id="signoutBtn" type="button">サインアウト</button>
    </div>
  </footer>
</div>

<!-- 赤ちゃん設定シート -->
<div class="overlay hidden" id="babyOverlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3>赤ちゃん設定<button class="close-x" id="babyCloseBtn" type="button" aria-label="閉じる">×</button></h3>

    <button class="set-row" type="button" data-edit="birthDate">
      <span class="set-label">生年月日</span>
      <span class="set-value unset" id="valBirthDate">未設定</span>
      <span class="set-chev">›</span>
    </button>
    <div class="set-editor hidden" id="editor-birthDate">
      <input type="date" id="inputBirthDate">
    </div>

    <button class="set-row" type="button" data-edit="birthWeight">
      <span class="set-label">出生体重</span>
      <span class="set-value unset" id="valBirthWeight">未設定</span>
      <span class="set-chev">›</span>
    </button>
    <div class="set-editor hidden" id="editor-birthWeight">
      <input type="number" id="inputBirthWeight" inputmode="numeric" min="500" max="6000" step="10" placeholder="例：3200">
      <button class="btn-primary" id="saveBirthWeightBtn" type="button">保存する</button>
      <button class="btn-sub" id="cancelBirthWeightBtn" type="button">キャンセル</button>
    </div>

    <button class="set-row" type="button" data-edit="weight">
      <span class="set-label">現在の体重</span>
      <span class="set-value unset" id="valWeight">未設定</span>
      <span class="set-chev">›</span>
    </button>
    <div class="set-editor hidden" id="editor-weight">
      <input type="number" id="inputWeight" inputmode="numeric" min="500" max="20000" step="10" placeholder="例：3800">
      <button class="btn-primary" id="saveWeightBtn" type="button">保存する</button>
      <button class="btn-sub" id="cancelWeightBtn" type="button">キャンセル</button>
    </div>

    <p class="sheet-sec-label">目標</p>
    <button class="set-row" type="button" data-edit="goal">
      <span class="set-label">目標</span>
      <span class="set-value unset" id="valGoal">未設定</span>
      <span class="set-chev">›</span>
    </button>
    <div class="set-editor hidden" id="editor-goal">
      <div class="goal-inputs">
        <div class="goal-field">
          <input type="number" id="inputGoalMl" inputmode="numeric" pattern="[0-9]*" min="1" max="500" step="1" placeholder="50" aria-label="1回量（ml）">
          <span class="goal-unit">ml</span>
        </div>
        <div class="goal-field">
          <input type="number" id="inputGoalTimes" inputmode="numeric" pattern="[0-9]*" min="1" max="20" step="1" placeholder="8" aria-label="1日の回数">
          <span class="goal-unit">回</span>
        </div>
      </div>
      <button class="btn-primary" id="saveGoalBtn" type="button">保存する</button>
      <button class="btn-sub" id="clearGoalBtn" type="button">自動に戻す</button>
    </div>

    <p class="sheet-sec-label">月齢別の目安</p>
    <div class="age-table" id="ageTable"></div>

    <p class="sheet-sec-label">リマインド</p>
    <div class="toggle-row">
      <span class="t-label">次の授乳のリマインド</span>
      <span class="t-state" id="remindState">OFF</span>
      <button class="switch" id="remindToggle" type="button" role="switch" aria-checked="false" aria-label="リマインド"><span class="knob"></span></button>
    </div>

    <p class="sheet-sec-label">接続設定</p>
    <div class="conn-box" id="setupCard">
      <h4>初期設定</h4>
      <label for="clientIdInput">Google OAuth クライアントID</label>
      <input id="clientIdInput" type="text" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off" spellcheck="false">
      <label for="calendarIdInput">カレンダーID</label>
      <input id="calendarIdInput" type="text" autocomplete="off" spellcheck="false">
      <button class="btn-primary" id="saveSettingsBtn" type="button">保存してサインインへ</button>
      <button class="btn-sub" id="cancelSettingsBtn" type="button">閉じる</button>
    </div>
  </div>
</div>

<!-- 日別ポップアップ -->
<div class="overlay hidden" id="dayOverlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="dayTitle">—</h3>
    <div class="day-total" id="dayTotal"></div>
    <div class="rec-list" id="dayList"></div>
    <button class="btn-sub" id="dayCloseBtn" type="button" style="margin-top:14px;">閉じる</button>
  </div>
</div>

<!-- 月別 日一覧 -->
<div class="overlay hidden" id="monthOverlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="monthTitle">—</h3>
    <div id="monthDays"></div>
    <button class="btn-sub" id="monthCloseBtn" type="button" style="margin-top:14px;">閉じる</button>
  </div>
</div>

<!-- 週間ビューワー -->
<div class="overlay hidden" id="viewerOverlay">
  <div class="sheet viewer-sheet" role="dialog" aria-modal="true">
    <h3 id="viewerTitle">—<button class="close-x" id="viewerCloseX" type="button" aria-label="閉じる">×</button></h3>
    <div class="viewer-scroll" id="viewerScroll">
      <div class="viewer-grid" id="viewerGrid"></div>
    </div>
    <div class="viewer-nav">
      <button class="btn-sub" id="viewerPrevBtn" type="button">‹ 前のログ</button>
      <button class="btn-sub viewer-close" id="viewerCloseBtn" type="button">閉じる</button>
      <button class="btn-sub" id="viewerNextBtn" type="button">次のログ ›</button>
    </div>
  </div>
</div>

<!-- 全月一覧 -->
<div class="overlay hidden" id="allMonthsOverlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3>月間のログ</h3>
    <div id="allMonthsBody"></div>
    <button class="btn-sub" id="allMonthsCloseBtn" type="button" style="margin-top:14px;">閉じる</button>
  </div>
</div>

<!-- 編集シート -->
<div class="overlay hidden" id="editOverlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="editTitle">記録を編集</h3>
    <label for="editDateTime">日時</label>
    <input type="datetime-local" id="editDateTime">
    <div class="preset-row" id="presetRow">
      <button class="preset" type="button" data-min="30">30分前</button>
      <button class="preset" type="button" data-min="60">1時間前</button>
      <button class="preset" type="button" data-min="90">1時間30分前</button>
      <button class="preset" type="button" data-min="120">2時間前</button>
    </div>
    <div id="editMemoWrap" class="hidden">
      <label for="editMemoText">メモ</label>
      <input type="text" id="editMemoText" autocomplete="off">
    </div>
    <div id="editOptsWrap">
      <label id="editOptsLabel">内容</label>
      <div class="opt-row" id="editOpts"></div>
      <div class="milk-custom hidden" id="editMilkCustom">
        <input type="number" id="editMilkAmount" inputmode="numeric" pattern="[0-9]*" min="1" step="1" aria-label="ミルクの量（ml）">
        <span class="milk-unit">ml</span>
      </div>
    </div>
    <button class="btn-primary" id="editSaveBtn" type="button">保存する</button>
    <button class="btn-danger" id="editDeleteBtn" type="button">この記録を削除</button>
    <button class="btn-sub" id="editCancelBtn" type="button">キャンセル</button>
  </div>
</div>

};
var KIND = {

  breast: { label:'母乳',     cat:'feed' },
  milk:   { label:'ミルク',   cat:'feed' },
  memo:   { label:'メモ',     cat:'memo' }
};
function icon(kind, cls){ return IC[kind]; }
function escHTML(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function labelOf(rec){
  if(rec.kind==='memo') return escHTML(rec.text || 'メモ');
  if(rec.kind==='milk') return 'ミルク ' + (rec.amount||0) + 'ml';
  return KIND[rec.kind].label;
}
function titleOf(rec){
  if(rec.kind==='pee') return 'オムツ：おしっこ';
  if(rec.kind==='poop') return 'オムツ：うんち';
  if(rec.kind==='breast') return '授乳：母乳';
  if(rec.kind==='memo') return rec.text ? 'メモ：' + rec.text : 'メモ';
  return '授乳：ミルク ' + (rec.amount||0) + 'ml';
}

function parseBirthDate(){
  if(!babySettings.birthDate) return null;
  var p = String(babySettings.birthDate).split('-');
  if(p.length !== 3) return null;
  var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  return isNaN(d.getTime()) ? null : d;
}
function ageDays(){
  var b = parseBirthDate();
  if(!b) return null;
  var diff = startOfDay(new Date()) - startOfDay(b);
  return Math.floor(diff / 86400000);
}
function ageBand(){
  var days = ageDays();
  if(days === null || days < 0) return null;
  for(var i=0;i<AGE_BANDS.length;i++){
    if(days >= AGE_BANDS[i].minD && days < AGE_BANDS[i].maxD) return AGE_BANDS[i];
  }
  return null;
}
/* 目安：{perFeed, times, daily, band} / 対象外・未設定は null
   目標（goalMl・goalTimes）が設定されていればそれを最優先で使う。
   未設定のときは従来どおり、おすすめ量は50ml固定として扱い
   （哺乳瓶バッジと「今日のミルク」の目標はこの値を使う）、
   回数だけは月齢区分の回数を使い、目標は 50ml × 回数 とする */
var RECOMMENDED_ML = 50;
/* 月齢区分1行ぶんの目標値：1回量は区分の範囲の中央値
   （範囲が無い区分はその値そのもの。例：1〜2歳=120ml、2〜3歳=100ml）、
   回数は区分の標準回数を使う */
function bandGoal(b){
  if(!b) return null;
  return { ml: Math.round((b.minMl + b.maxMl) / 2), times: b.times };
}
/* ユーザーが設定した目標（1回量ml・1日の回数）。未設定・不正値は null */
function customGoal(){
  var ml = parseInt(babySettings.goalMl, 10);
  var times = parseInt(babySettings.goalTimes, 10);
  if(!(ml > 0) || !(times > 0)) return null;
  return { ml: ml, times: times };
}
function getGuide(){
  var custom = customGoal();
  if(custom) return { perFeed: custom.ml, times: custom.times, daily: custom.ml * custom.times, band: ageBand() };
  var band = ageBand();
  if(!band || !band.times) return null;
  return { perFeed: RECOMMENDED_ML, times: band.times, daily: RECOMMENDED_ML * band.times, band: band };
}
/* 表示用目安：個人の目安が無い（未設定・出産前）間は月齢表の最初の区分
   の回数（8回）とおすすめ50mlで表示し（50ml × 8回 = 1日400ml）、
   ゲージ・おすすめバッジ・次回時刻が常に見えるようにする。
   3歳以上は対象外として null */
function displayGuide(){
  var g = getGuide();
  if(g) return { guide: g, fallback: false };
  var days = ageDays();
  if(days !== null && days >= 0){
    var b = ageBand();
    if(!b || !b.times) return null; /* 対象外の月齢（3歳以上）では無理に表示しない */
  }
  var fb = AGE_BANDS[0];
  return { guide: { perFeed: RECOMMENDED_ML, times: fb.times, daily: RECOMMENDED_ML * fb.times, band: fb }, fallback: true };
}

function fmtDateStr(d){
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function cleanWeightLog(arr){
  if(!Array.isArray(arr)) return [];
  var out = [];
  for(var i=0;i<arr.length;i++){
    var e = arr[i];
    if(e && typeof e.d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.d)){
      var w = parseInt(e.w, 10);
      if(w > 0) out.push({ d: e.d, w: w });
    }
  }
  out.sort(function(a,b){ return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });
  return out;
}
/* 体重が変更されたら当日の履歴として記録する（同日は上書き） */
function pushWeightLog(w){
  w = parseInt(w, 10);
  if(!w || w <= 0) return;
  var today = fmtDateStr(new Date());
  var log = babySettings.weightLog || [];
  var found = false;
  for(var i=0;i<log.length;i++){
    if(log[i].d === today){ log[i].w = w; found = true; break; }
  }
  if(!found) log.push({ d: today, w: w });
  log.sort(function(a,b){ return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });
  if(log.length > 500) log = log.slice(log.length - 500);
  babySettings.weightLog = log;
}
/* 今日の体重記録（weightLogの当日分）。無ければ null */
function todayWeightEntry(){
  var log = babySettings.weightLog || [];
  var today = fmtDateStr(new Date());
  for(var i=0;i<log.length;i++){ if(log[i].d === today) return log[i]; }
  return null;
}

/* ================= 日時ユーティリティ ================= */
var WD = ['日','月','火','水','木','金','土'];
function pad(n){ return (n<10?'0':'') + n; }
function startOfDay(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function fmtTime(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtMD(d){ return (d.getMonth()+1) + '/' + d.getDate(); }
function fmtNow(d){
  return (d.getMonth()+1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '） ' + fmtTime(d);
}
function fmtElapsed(from, now){
  var min = Math.floor((now - from) / 60000);
  if(min < 0) min = 0;
  if(min < 60) return min + '分前';
  var h = Math.floor(min/60), m = min % 60;
  if(h < 24) return h + '時間' + (m ? m + '分' : '') + '前';
  return Math.floor(h/24) + '日前';
}
function toLocalInput(d){
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

/* ================= チャイム（記録成功時のみ） ================= */
var audioCtx = null;
function ensureAudio(){
  try{
    if(!audioCtx){ var AC = window.AudioContext || window.webkitAudioContext; if(AC) audioCtx = new AC(); }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function playChime(){
  if(!audioCtx) return;
  try{
    var freqs = [1318.51, 1567.98, 2093.0];
    var t0 = audioCtx.currentTime + 0.02;
    for(var i=0;i<freqs.length;i++){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freqs[i];
      var t = t0 + i * 0.09;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.4);
    }
  }catch(e){}
}

/* 次の授乳の目安時刻（前回行の「次 HH:MM」とリマインド予定で共用）。
   最新の授乳記録＋目安の間隔から授乳にかかる約30分を差し引いて出し、
   5分単位に丸める。対象が無ければ null */
function getNextFeedDate(){
  var dg = displayGuide();
  if(!dg) return null;
  var rec = null;
  for(var i=0;i<records.length;i++){ if(KIND[records[i].kind].cat==='feed'){ rec = records[i]; break; } }
  if(!rec) return null;
  var intervalMs = (24 / dg.guide.times) * 3600000 - 30 * 60 * 1000;
  var next = new Date(rec.start.getTime() + intervalMs);
  return new Date(Math.round(next.getTime() / 300000) * 300000);
}
function prevHTML(cat){
  var now = new Date();
  var rec = null;
  for(var i=0;i<records.length;i++){ if(KIND[records[i].kind].cat===cat){ rec = records[i]; break; } }
  var s = '<span class="plabel">前回</span>';
  if(!rec){ s += '<span class="none">まだなし</span>'; return s; }
  s += '<span class="elapsed">' + fmtElapsed(rec.start, now) + '</span>';
  if(cat === 'feed'){
    var nextFeed = getNextFeedDate();
    if(nextFeed){
      /* リマインドONのときだけ、次回時刻の左にベルを付けて
         その時刻にカレンダーの通知が来ることを知らせる */
      var bell = babySettings.remind ? '<span class="next-bell" role="img" aria-label="通知あり">' + IC.bell + '</span>' : '';
      s += '<span class="next-time">' + bell + '<span>次 ' + fmtTime(nextFeed) + '</span></span>';
    }
  }
  return s;
}

function renderGauge(){
  var wrap = $('milkGaugeWrap');
  var dg = displayGuide();
  if(!dg){ wrap.classList.add('hidden'); $('gaugeHead').classList.add('hidden'); return; }
  var g = dg.guide;
  var now = new Date();
  var milkSum = 0;
  records.forEach(function(r){
    if(!sameDay(r.start, now)) return;
    if(r.kind==='milk') milkSum += (r.amount||0);
  });
  var total = milkSum;
  var goal = g.daily;
  var milkPct;
  if(total <= goal){
    milkPct = goal ? (milkSum/goal*100) : 0;
  } else {
    milkPct = 100;
  }
  var html = '';
  if(milkSum > 0){
    html += '<div class="gauge-seg milk" style="width:' + milkPct + '%;">' + (milkPct >= 20 ? 'ミルク ' + milkSum + 'ml' : '') + '</div>';
  }
  $('gaugeBar').innerHTML = html;
  /* 合計と目標は同じ色（白）で統一する */
  $('gaugeTotal').textContent = total + 'ml';
  $('gaugeTotal').style.color = '';
  $('gaugeTotal').style.fontWeight = '';
  $('gaugeGoal').textContent = '目標 ' + goal + 'ml';
  wrap.classList.remove('hidden');
  $('gaugeHead').classList.remove('hidden');
}
function renderToday(){
  var now = new Date();
  var todays = records.filter(function(r){ return sameDay(r.start, now); });
  var show = todays.slice();
  if(show.length < 4){
    var past = records.filter(function(r){ return !sameDay(r.start, now); });
    show = show.concat(past.slice(0, 5 - show.length));
  } else {
    show = show.slice(0, Math.max(show.length, 0));
  }
  /* 今日分が5件以上ある場合は今日分を全て出す（最低ラインは合計5件の補完ルール） */
  if(todays.length >= 4){ show = todays; }
  if(!show.length){
    $('todayList').innerHTML = '<div class="empty">まだ記録がありません</div>';
    return;
  }
  $('todayList').innerHTML = show.map(function(r){ return recRowHTML(r, true); }).join('');
  bindRecRows($('todayList'));
}
function dayStats(date){ return dayStatsFrom(records, date); }
function dayStatsFrom(src, date){
  var st = { pee:0, poop:0, breast:0, milk:0, list:[] };
  src.forEach(function(r){
    if(sameDay(r.start, date)){
      st.list.push(r);
      if(r.kind==='pee') st.pee++;
      else if(r.kind==='poop') st.poop++;
      else if(r.kind==='breast') st.breast++;
      else if(r.kind==='milk') st.milk += (r.amount||0);
    }
  });
  return st;
}
/* その日の体重（weightLogの当日分）と前日比。前日の記録が無ければ diff は null */
function dayWeightInfo(d){
  var log = babySettings.weightLog || [];
  if(!log.length) return null;
  var ds = fmtDateStr(d);
  var w = null;
  for(var i=0;i<log.length;i++){ if(log[i].d === ds) w = log[i].w; }
  if(w === null) return null;
  var prev = new Date(d); prev.setDate(prev.getDate() - 1);
  var ps = fmtDateStr(prev);
  var pw = null;
  for(var j=0;j<log.length;j++){ if(log[j].d === ps) pw = log[j].w; }
  return { w: w, diff: (pw === null ? null : w - pw) };
}
function fmtDayDiff(diff){
  if(diff > 0) return '+' + diff;
  if(diff < 0) return '−' + Math.abs(diff);
  return '±0';
}

  if(info.diff !== null){

/* ================= 月間のログ ================= */
/* 集計用データ：アーカイブ（長期取得分）と通常表示分をIDで統合し、通常表示分を優先する */
function logSource(){
  if(!archiveRecords) return records;
  var map = {}, out = [], i;
  for(i=0;i<archiveRecords.length;i++){ map[archiveRecords[i].id] = archiveRecords[i]; }
  for(i=0;i<records.length;i++){ map[records[i].id] = records[i]; }
  for(var k in map){ if(Object.prototype.hasOwnProperty.call(map, k)) out.push(map[k]); }
  out.sort(function(a,b){ return b.start - a.start; });
  return out;
}
function monthStats(y, m){
  var src = logSource();
  var milk = 0, diaper = 0, count = 0;
  src.forEach(function(r){
    if(r.kind==='memo') return; /* メモは集計に数えない */
    if(r.start.getFullYear()===y && r.start.getMonth()===m){
      count++;
      if(r.kind==='milk') milk += (r.amount||0);
      else if(r.kind==='pee' || r.kind==='poop') diaper++;
    }
  });
  var now = new Date();
  var days = (y===now.getFullYear() && m===now.getMonth()) ? now.getDate() : new Date(y, m+1, 0).getDate();
  return {
    count: count,
    milkAvg: count ? Math.round(milk / days) : null,
    diaperAvg: count ? diaper / days : null
  };
}
/* 月初からの体重増加分：その月の最後の体重 − 月初時点の体重
   （月初時点＝その月より前の最後の記録。無ければその月最初の記録） */
function monthWeightGain(y, m){
  var log = babySettings.weightLog || [];
  if(!log.length) return null;
  var startStr = y + '-' + pad(m+1) + '-01';
  var endStr = y + '-' + pad(m+1) + '-' + pad(new Date(y, m+1, 0).getDate());
  var base = null, last = null, firstIn = null;
  for(var i=0;i<log.length;i++){
    var e = log[i];
    if(e.d < startStr) base = e;
    else if(e.d <= endStr){ if(!firstIn) firstIn = e; last = e; }
  }
  if(!last) return null;
  if(!base){
    /* 月より前の記録が無い場合、月内に2件以上ないと増加分は出せない（―表示） */
    if(!firstIn || firstIn === last) return null;
    base = firstIn;
  }
  return last.w - base.w;
}
function fmtGain(g){
  if(g === null) return '―';
  if(g > 0) return '+' + g.toLocaleString('ja-JP') + 'g';
  if(g < 0) return '-' + Math.abs(g).toLocaleString('ja-JP') + 'g';
  return '0g';
}

    '<span class="month-name">' + y + '年' + (m+1) + '月</span>' +
    '<span class="mvalue">' + fmtGain(monthWeightGain(y, m)) + '</span>' +

function renderBabySummary(){
  var el = $('babySummary');
  var days = ageDays();
  var ageText = '';
  if(days !== null && days >= 0){
    if(days < 365) ageText = '生後' + days + '日';
    else {
      /* カレンダー基準で歳・か月を出す（日数÷30だと「1歳12か月」になるため） */
      var bAge = parseBirthDate();
      var nowAge = new Date();
      var y = nowAge.getFullYear() - bAge.getFullYear();
      var m = nowAge.getMonth() - bAge.getMonth();
      if(nowAge.getDate() < bAge.getDate()) m--;
      if(m < 0){ y--; m += 12; }
      if(y <= 0){ y = 1; m = 0; }
      if(m >= 12){ y += Math.floor(m/12); m = m % 12; }
      ageText = y + '歳' + (m ? m + 'か月' : '');
    }
  }
  var w = fmtGram(babySettings.weight);
  if(!ageText && !w){
    el.innerHTML = '<span class="unset">赤ちゃん設定を入力</span>';
    renderWeightRecordBtn();
    return;
  }
  var html = '';
  if(ageText) html += '<span>' + ageText + '</span>　';

  el.innerHTML = html;

function applyBabySettings(obj){
  if(!obj || typeof obj !== 'object') return;
  if(typeof obj.birthDate === 'string') babySettings.birthDate = obj.birthDate;
  if(obj.birthWeight !== undefined && obj.birthWeight !== null) babySettings.birthWeight = obj.birthWeight;
  if(obj.weight !== undefined && obj.weight !== null) babySettings.weight = obj.weight;
  if(obj.remind !== undefined) babySettings.remind = !!obj.remind;
  if(obj.goalMl !== undefined && obj.goalMl !== null) babySettings.goalMl = obj.goalMl;
  if(obj.goalTimes !== undefined && obj.goalTimes !== null) babySettings.goalTimes = obj.goalTimes;
  if(obj.goalBand !== undefined && obj.goalBand !== null) babySettings.goalBand = obj.goalBand;
  if(Array.isArray(obj.weightLog)) babySettings.weightLog = cleanWeightLog(obj.weightLog);
  saveBabyLocal();
  renderBabyUI();
  /* 相手がリマインドを切り替えた場合も、この端末から予定を追随させる */
  scheduleSyncReminder();
}
function loadBabySettingsFromCal(){
  if(!accessToken) return Promise.resolve();
  var path = '/calendars/' + encodeURIComponent(calendarId) + '/events?q=' +
    encodeURIComponent('赤ちゃん設定') + '&maxResults=20&singleEvents=true';
  return apiFetch(path).then(function(data){
    var items = (data && data.items) || [];
    for(var i=0;i<items.length;i++){
      var ev = items[i];
      var desc = ev.description || '';
      var mi = desc.indexOf(SETTINGS_MARKER);
      if(mi < 0) continue;
      settingsEventId = ev.id;
      settingsEventRaw = ev;
      try{
        var j = JSON.parse(desc.slice(mi + SETTINGS_MARKER.length).split('\n')[0]);
        applyBabySettings(j);
      }catch(e){}
      break;
    }
  }).catch(function(){});
}
function saveBabySettingsToCal(){
  if(!accessToken) return;
  var body;
  if(settingsEventId && settingsEventRaw && settingsEventRaw.start && settingsEventRaw.end){
    body = {
      summary: SETTINGS_TITLE,
      description: SETTINGS_MARKER + JSON.stringify(babySettings),
      start: settingsEventRaw.start,
      end: settingsEventRaw.end
    };
  } else {
    var now = new Date();
    var end = new Date(now.getTime() + 5*60000);
    body = {
      summary: SETTINGS_TITLE,
      description: SETTINGS_MARKER + JSON.stringify(babySettings),
      start: { dateTime: now.toISOString(), timeZone: 'Asia/Tokyo' },
      end: { dateTime: end.toISOString(), timeZone: 'Asia/Tokyo' }
    };
  }
  var path = '/calendars/' + encodeURIComponent(calendarId) + '/events' + (settingsEventId ? '/' + encodeURIComponent(settingsEventId) : '');
  apiFetch(path, { method: settingsEventId ? 'PUT' : 'POST', body: JSON.stringify(body) })
    .then(function(res){
      if(res && res.id){ settingsEventId = res.id; settingsEventRaw = res; }
    }).catch(function(){});
}

  saveBabyLocal();

/* ================= 週間ビューワー（7日並列・1時間単位） ================= */
function viewerChipLabel(rec){
  if(rec.kind==='pee') return 'おし';
  if(rec.kind==='poop') return 'うんち';
  if(rec.kind==='breast') return '母乳';
  return (rec.amount || 0) + 'ml';
}
/* 表示中の週：0=今日までの7日間、-1=その前の7日間、+側は今日より先には進まない */
var viewerWeekOffset = 0;
function renderViewer(){
  var endDay = startOfDay(new Date());
  endDay.setDate(endDay.getDate() + viewerWeekOffset * 7);
  var realToday = startOfDay(new Date());
  var days = [];
  for(var i=6;i>=0;i--){
    var d = new Date(endDay); d.setDate(d.getDate() - i);
    days.push(d);
  }
  var prevB = $('viewerPrevBtn'), nextB = $('viewerNextBtn');
  if(nextB) nextB.disabled = viewerWeekOffset >= 0;
  if(prevB) prevB.disabled = false;
  $('viewerTitle').firstChild.textContent =
    fmtMD(days[0]) + '（' + WD[days[0].getDay()] + '）〜' + fmtMD(days[6]) + '（' + WD[days[6].getDay()] + '）';
  /* 日×1時間枠 → 記録リスト */
  var src = logSource();
  var slots = {}; /* key: dayIndex*24+hour */
  src.forEach(function(r){
    if(r.kind==='memo') return; /* メモはビューワーのチップにしない */
    for(var di=0; di<7; di++){
      if(sameDay(r.start, days[di])){
        var slot = r.start.getHours();
        var key = di*24 + slot;
        if(!slots[key]) slots[key] = [];
        slots[key].push(r);
        break;
      }
    }
  });
  Object.keys(slots).forEach(function(k){
    slots[k].sort(function(a,b){ return a.start - b.start; });
  });
  var html = '<div class="v-corner"></div>';
  days.forEach(function(d, di){
    /* 体重は列ヘッダー（M/D・曜日の下）に数値だけ1行。記録が無い日は空行で高さをそろえる */
    var wInfo = dayWeightInfo(d);
    var wText = wInfo ? wInfo.w.toLocaleString('ja-JP') : '&nbsp;';
    html += '<div class="v-head' + (sameDay(d, realToday) ? ' today' : '') + '"><span class="v-md">' + fmtMD(d) +
      '</span><span class="v-wd">（' + WD[d.getDay()] + '）</span><span class="v-w">' + wText + '</span></div>';
  });
  for(var s=0; s<24; s++){
    html += '<div class="v-time hour" data-slot="' + s + '">' + s + ':00</div>';
    for(var c=0; c<7; c++){
      var list = slots[c*24 + s] || [];
      html += '<div class="v-slot hour' + (sameDay(days[c], realToday) ? ' today' : '') + '">';
      list.forEach(function(r){
        html += '<button class="v-chip ' + r.kind + '" type="button" data-eid="' + r.id + '">' +
          IC[r.kind] + '<span>' + viewerChipLabel(r) + '</span></button>';
      });
      html += '</div>';
    }
  }
  /* 24:00 の終端ライン */
  html += '<div class="v-time hour">24:00</div>';
  for(var e=0; e<7; e++){ html += '<div class="v-slot hour" style="min-height:0;padding:0;"></div>'; }
  $('viewerGrid').innerHTML = html;
  var chips = $('viewerGrid').querySelectorAll('.v-chip');
  for(var j=0;j<chips.length;j++){
    chips[j].addEventListener('click', function(){
      var id = this.getAttribute('data-eid');
      var found = null, k;
      for(k=0;k<records.length;k++){ if(records[k].id===id){ found = records[k]; break; } }
      if(!found && archiveRecords){
        for(k=0;k<archiveRecords.length;k++){ if(archiveRecords[k].id===id){ found = archiveRecords[k]; break; } }
      }
      if(found){
        closeViewer();
        openEdit(found);
      }
    });
  }
}
function scrollViewerToNow(){
  /* 現在時刻あたりが見える位置へスクロール */
  var now = new Date();
  var curSlot = now.getHours();
  requestAnimationFrame(function(){
    var sc = $('viewerScroll');
    if(!sc) return;
    var row = sc.querySelector('.v-time[data-slot="' + Math.max(0, curSlot - 1) + '"]');
    if(row){
      sc.scrollTop = Math.max(0, row.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 40);
    }
  });
}
/* ビューワー表示中だけ背景ページを固定し、背後のスクロールを止める。
   ビューワー内の時間スクロール（viewerScroll）はそのまま動く */
var viewerLocked = false;
var viewerLockedY = 0;
var viewerLastTouchY = null;
function lockViewerBackground(){
  if(viewerLocked) return;
  viewerLocked = true;
  viewerLockedY = window.pageYOffset || document.documentElement.scrollTop || 0;
  document.documentElement.classList.add('viewer-locked');
  document.body.classList.add('viewer-locked');
  document.body.style.top = (-viewerLockedY) + 'px';
}
function unlockViewerBackground(){
  if(!viewerLocked) return;
  viewerLocked = false;
  viewerLastTouchY = null;
  document.documentElement.classList.remove('viewer-locked');
  document.body.classList.remove('viewer-locked');
  document.body.style.top = '';
  window.scrollTo(0, viewerLockedY);
}
function closeViewer(){
  $('viewerOverlay').classList.add('hidden');
  unlockViewerBackground();
}
document.addEventListener('touchstart', function(e){
  if(viewerLocked && e.touches.length === 1) viewerLastTouchY = e.touches[0].clientY;
}, { passive:true });
document.addEventListener('touchmove', function(e){
  if(!viewerLocked) return;
  var sc = $('viewerScroll');
  /* スクロール領域の外（背面・タイトル・ボタン帯）のドラッグは背景へ伝えない */
  if(!sc || !sc.contains(e.target)){ e.preventDefault(); return; }
  if(viewerLastTouchY === null || !e.touches.length) return;
  var y = e.touches[0].clientY;
  var dy = y - viewerLastTouchY;
  viewerLastTouchY = y;
  /* 上端・下端でのドラッグも背景へ伝えない（スクロール連鎖の防止） */
  var maxTop = sc.scrollHeight - sc.clientHeight;
  if(maxTop <= 0 || (sc.scrollTop <= 0 && dy > 0) || (sc.scrollTop >= maxTop - 1 && dy < 0)){
    e.preventDefault();
  }
}, { passive:false });
function openViewer(){
  viewerWeekOffset = 0;
  renderViewer();
  $('viewerOverlay').classList.remove('hidden');
  lockViewerBackground();
  scrollViewerToNow();
}
$('viewerBtn').addEventListener('click', openViewer);
$('viewerPrevBtn').addEventListener('click', function(){
  viewerWeekOffset--;
  renderViewer();
  /* 古い週は通常表示分（31日）より前になることがあるのでアーカイブも広げて取る */
  loadArchive((0 - viewerWeekOffset) * 7 + 14);

$('viewerNextBtn').addEventListener('click', function(){

/* ================= Google Calendar API ================= */
function apiFetch(path, options){
  options = options || {};
  options.headers = options.headers || {};
  options.headers['Authorization'] = 'Bearer ' + accessToken;
  if(options.body) options.headers['Content-Type'] = 'application/json';
  return fetch('https://www.googleapis.com/calendar/v3' + path, options).then(function(res){
    if(res.status === 401){
      accessToken = null; tokenExpiry = 0;
      updateAuthUI();
      throw new Error('サインインの有効期限が切れました。もう一度サインインしてください。');
    }
    if(!res.ok){
      return res.json().catch(function(){ return {}; }).then(function(j){
        var msg = (j && j.error && j.error.message) ? j.error.message : ('HTTP ' + res.status);
        throw new Error(msg);
      });
    }
    if(res.status === 204) return null;
    return res.json();
  });
}
function markerJSON(kind, amount, text){
  var o = { v:1, kind:kind };
  if(kind==='milk') o.amount = amount;
  if(kind==='memo') o.text = text || '';
  return 'muse-baby-log:' + JSON.stringify(o);
}
function parseEvent(ev){
  if(!ev || !ev.start || !ev.start.dateTime) return null;
  var start = new Date(ev.start.dateTime);
  if(isNaN(start.getTime())) return null;
  var kind = null, amount = 0, text = '';
  var desc = ev.description || '';
  var mi = desc.indexOf('muse-baby-log:');
  if(mi >= 0){
    try{
      var j = JSON.parse(desc.slice(mi + 'muse-baby-log:'.length).split('\n')[0]);
      if(j && j.kind && KIND[j.kind]){ kind = j.kind; amount = j.amount || 0; text = j.text || ''; }
    }catch(e){}
  }
  var title = (ev.summary || '').replace(/\s+/g, ' ').trim();
  if(!kind){
    if(/^メモ/.test(title)){
      kind = 'memo';
      text = title.replace(/^メモ[:：]\s*/, '');
      if(text === title) text = '';
    } else if(/^オムツ[:：]/.test(title)){
      if(title.indexOf('おしっこ') >= 0) kind = 'pee';
      else if(title.indexOf('うんち') >= 0 || title.indexOf('両方') >= 0) kind = 'poop';
    } else if(/^授乳[:：]/.test(title)){
      if(title.indexOf('母乳') >= 0) kind = 'breast';
      else if(title.indexOf('ミルク') >= 0){
        var m = title.match(/(\d+)\s*ml/i);
        kind = 'milk'; amount = m ? parseInt(m[1], 10) : 0;
      }
    }
  }
  if(!kind) return null;
  if(kind==='milk' && !amount){
    var m2 = title.match(/(\d+)\s*ml/i);
    if(m2) amount = parseInt(m2[1], 10);
  }
  return { id: ev.id, start: start, kind: kind, amount: amount, text: text };
}
function eventBody(kind, amount, when, text){
  var end = new Date(when.getTime() + 5*60000);
  return {
    summary: titleOf({kind:kind, amount:amount, text:text}),
    description: markerJSON(kind, amount, text),
    start: { dateTime: when.toISOString(), timeZone: 'Asia/Tokyo' },
    end:   { dateTime: end.toISOString(),  timeZone: 'Asia/Tokyo' }
  };
}
function loadRecords(silent){
  if(!accessToken) return Promise.resolve();
  var now = new Date();
  var from = startOfDay(now); from.setDate(from.getDate() - 31);
  var to = startOfDay(now); to.setDate(to.getDate() + 2);
  var qs = '?timeMin=' + encodeURIComponent(from.toISOString()) +
           '&timeMax=' + encodeURIComponent(to.toISOString()) +
           '&maxResults=300&singleEvents=true&orderBy=startTime';
  if(!silent) setStatus('読み込み中…');
  return apiFetch('/calendars/' + encodeURIComponent(calendarId) + '/events' + qs)
    .then(function(data){
      var items = (data && data.items) || [];
      records = items.map(parseEvent).filter(function(r){ return !!r; });
      records.sort(function(a,b){ return b.start - a.start; });
      if(records.length > 300) records = records.slice(0, 300);
      recordsLoaded = true;
      renderAll();
      scheduleSyncReminder();
      loadArchive(100);
      if(!silent) setStatus('');
    })
    .catch(function(err){
      setStatus('読み込めませんでした：' + err.message, true);
    });
}
/* ================= ログ用アーカイブ取得（月間集計用・ページネーション） ================= */
var archiveRecords = null;
var archiveSpan = 0;
var archiveFetchedAt = 0;
var archiveLoading = false;
function fetchEventsRange(from, to, maxItems){
  var all = [];
  function page(pageToken){
    var qs = '?timeMin=' + encodeURIComponent(from.toISOString()) +
             '&timeMax=' + encodeURIComponent(to.toISOString()) +
             '&maxResults=250&singleEvents=true&orderBy=startTime' +
             (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
    return apiFetch('/calendars/' + encodeURIComponent(calendarId) + '/events' + qs).then(function(data){
      var items = (data && data.items) || [];
      for(var i=0;i<items.length;i++){
        var r = parseEvent(items[i]);
        if(r) all.push(r);
      }
      if(data && data.nextPageToken && all.length < maxItems) return page(data.nextPageToken);
      return all;
    });
  }
  return page(null);
}
function loadArchive(daysBack){
  if(!accessToken || archiveLoading) return;
  if(archiveSpan >= daysBack && (Date.now() - archiveFetchedAt) < 50000) return;
  var span = Math.max(daysBack, archiveSpan);
  archiveLoading = true;
  var now = new Date();
  var from = startOfDay(now); from.setDate(from.getDate() - span);
  var to = startOfDay(now); to.setDate(to.getDate() + 2);
  fetchEventsRange(from, to, 2500).then(function(list){
    list.sort(function(a,b){ return b.start - a.start; });
    archiveRecords = list;
    archiveSpan = span;
    archiveFetchedAt = Date.now();
    renderMonths();
    if(!$('allMonthsOverlay').classList.contains('hidden')) renderAllMonths();
    if(!$('viewerOverlay').classList.contains('hidden')) renderViewer();
  }).catch(function(){
  }).then(function(){ archiveLoading = false; });
}

/* ================= リマインド（Googleカレンダーの予定＋通知） =================
   リマインドONのときだけ、共有カレンダーに「次の授乳の目安時刻」の予定を
   1件だけ登録する。繰り返し予定にはしない。
   - 記録の追加・編集・削除があったら、すぐには登録せず60秒待ってから
     記録を再読み込みし、リマインド予定を1回だけ登録・上書き更新する。
     続けて記録が入りやすい（母乳のあとにミルク追加、量の直し等）ためで、
     待っている間にまた記録が入ったら、その時点から60秒に数え直す
     （デバウンス）。画面表示のための読み込みはすぐに行うが、その際の
     リマインド同期は行わない。30秒ごとの自動更新・フォーカス時の
     読み込みでも、待機中はリマインド同期を先行させない
   - アプリを開いたとき・フォーカス時の追いつき同期は従来どおり即時に行う
     （待機中のデバウンスが無い場合）。待機中にアプリを閉じた場合は、
     次に開いたときの同期で登録される
   - 既に未来のリマインド予定がある場合は、消して作り直さず、その予定を
     新しい目安時刻へ更新（PUT）する。予定が無い場合だけ新規作成する。
     重複した未来の予定があれば、残す1件以外を消す
   - 予定には時刻ちょうど（0分前）のポップアップ通知を付ける
   - OFFにしたら登録済みの予定も消す（トグルの切り替えは待たずに即時）
   - タイトルとマーカーを記録と区別し、parseEventでは記録として数えない */
var REMIND_TITLE = 'リマインド：次の授乳の目安';
var REMIND_MARKER = 'muse-baby-remind:';
var REMIND_DEBOUNCE_MS = 60000;
var remindSyncing = false;
var remindSyncQueued = false;
var remindSyncTimer = null;
var remindDebounceTimer = null;
var remindDebouncePending = false;
function scheduleSyncReminder(){
  /* 記録変更後の60秒デバウンス待機中は、自動更新・フォーカス・設定同期
     などからの同期で先に登録しない。登録はデバウンス満了時の1回だけ */
  if(remindDebouncePending) return;
  if(remindSyncTimer) clearTimeout(remindSyncTimer);
  remindSyncTimer = setTimeout(function(){
    remindSyncTimer = null;
    syncReminder();
  }, 800);
}
/* 記録の追加・編集・削除のたびに呼ぶ：その時点から60秒数え直し、
   満了したら記録を再読み込みしてからリマインド予定を1回だけ同期する */
function scheduleDelayedReminderSync(){
  remindDebouncePending = true;
  if(remindSyncTimer){ clearTimeout(remindSyncTimer); remindSyncTimer = null; }
  if(remindDebounceTimer) clearTimeout(remindDebounceTimer);
  remindDebounceTimer = setTimeout(function(){
    remindDebounceTimer = null;
    remindDebouncePending = false;
    /* 最新の記録を読み込み直してから同期する（loadRecords完了後に
       scheduleSyncReminder経由で1回だけ同期される） */
    loadRecords(true);
  }, REMIND_DEBOUNCE_MS);
}
function cancelDelayedReminderSync(){
  if(remindDebounceTimer){ clearTimeout(remindDebounceTimer); remindDebounceTimer = null; }
  remindDebouncePending = false;
}
function isReminderEvent(ev){
  if(!ev) return false;
  var desc = ev.description || '';
  if(desc.indexOf(REMIND_MARKER) >= 0) return true;
  return (ev.summary || '') === REMIND_TITLE;
}
function fetchReminderEvents(){
  var now = new Date();
  var from = startOfDay(now); from.setDate(from.getDate() - 2);
  var to = startOfDay(now); to.setDate(to.getDate() + 3);
  var qs = '?timeMin=' + encodeURIComponent(from.toISOString()) +
           '&timeMax=' + encodeURIComponent(to.toISOString()) +
           '&maxResults=250&singleEvents=true&orderBy=startTime';
  return apiFetch('/calendars/' + encodeURIComponent(calendarId) + '/events' + qs)
    .then(function(data){
      var items = (data && data.items) || [];
      var out = [];
      for(var i=0;i<items.length;i++){
        var ev = items[i];
        if(!isReminderEvent(ev) || !ev.start || !ev.start.dateTime) continue;
        var st = new Date(ev.start.dateTime);
        if(!isNaN(st.getTime())) out.push({ id: ev.id, start: st });
      }
      return out;
    });
}
function deleteReminderEvent(id){
  return apiFetch('/calendars/' + encodeURIComponent(calendarId) + '/events/' + encodeURIComponent(id), {
    method: 'DELETE'
  }).catch(function(){});
}
function reminderEventBody(when){
  var end = new Date(when.getTime() + 30*60000);
  return {
    summary: REMIND_TITLE,
    description: REMIND_MARKER + JSON.stringify({ v:1, target: when.toISOString() }),
    start: { dateTime: when.toISOString(), timeZone: 'Asia/Tokyo' },
    end:   { dateTime: end.toISOString(),  timeZone: 'Asia/Tokyo' },
    reminders: { useDefault: false, overrides: [ { method: 'popup', minutes: 0 } ] }
  };
}
function createReminderEvent(when){
  return apiFetch('/calendars/' + encodeURIComponent(calendarId) + '/events', {
    method: 'POST', body: JSON.stringify(reminderEventBody(when))
  });
}
/* 既存のリマインド予定を新しい目安時刻へ上書き更新する。
   更新対象が消えていた等で更新できなければ、新規作成に切り替える */
function updateReminderEvent(id, when){
  return apiFetch('/calendars/' + encodeURIComponent(calendarId) + '/events/' + encodeURIComponent(id), {
    method: 'PUT', body: JSON.stringify(reminderEventBody(when))
  }).catch(function(){
    return createReminderEvent(when);
  });
}
function syncReminder(){
  if(!accessToken) return Promise.resolve();
  /* ONのときは目安時刻の計算に記録が必要なので、初回読み込み前は見送る
     （読み込み完了後に loadRecords 側から改めて呼ばれる） */
  if(babySettings.remind && !recordsLoaded) return Promise.resolve();
  if(remindSyncing){ remindSyncQueued = true; return Promise.resolve(); }
  remindSyncing = true;
  return fetchReminderEvents().then(function(list){
    var nowMs = Date.now();
    /* まだ時刻が来ていない予定だけが差し替え・削除の対象 */
    var futures = list.filter(function(r){ return r.start.getTime() > nowMs; });
    var chain = Promise.resolve();
    function delAll(arr){
      arr.forEach(function(r){
        chain = chain.then(function(){ return deleteReminderEvent(r.id); });
      });
    }
    if(!babySettings.remind){
      delAll(futures);
      return chain;
    }
    var target = getNextFeedDate();
    if(!target || target.getTime() <= nowMs){
      /* 目安が無い／既に過ぎている場合は新しい予定を作らず、残っている未来の予定を消す */
      delAll(futures);
      return chain;
    }
    /* 予定ありの場合は更新する：残す1件（同じ時刻の予定があればそれ、
       無ければ最も近い未来の予定）を新しい目安時刻へ上書き更新し、
       余分な未来の予定だけ消す。予定が無ければ新規作成する。
       これにより、授乳を記録するたびに通知はその記録起点の時刻へ移る */
    futures.sort(function(a,b){ return a.start - b.start; });
    var keeper = null;
    futures.forEach(function(r){
      if(!keeper && Math.abs(r.start.getTime() - target.getTime()) < 60000) keeper = r;
    });
    if(!keeper && futures.length) keeper = futures[0];
    if(keeper){
      delAll(futures.filter(function(r){ return r.id !== keeper.id; }));
      return chain.then(function(){ return updateReminderEvent(keeper.id, target); });
    }
    return chain.then(function(){ return createReminderEvent(target); });
  }).catch(function(){
  }).then(function(){
    remindSyncing = false;
    if(remindSyncQueued){ remindSyncQueued = false; syncReminder(); }
  });
}

/* ================= 認証（Google Identity Services） ================= */
function updateAuthUI(){
  var signedIn = !!accessToken && Date.now() < tokenExpiry;
  $('signedBox').classList.toggle('hidden', !signedIn);
  $('signinBtn').classList.toggle('hidden', signedIn || !clientId);
  /* サインインボタンが隠れているときはトップバー自体を畳む（サインイン中表示はページ最下部） */
  $('topbar').style.display = (signedIn || !clientId) ? 'none' : '';
  $('reloadBtn').classList.toggle('hidden', !signedIn);
  $('signoutBtn').classList.toggle('hidden', !signedIn);
  setBusy(busy);
}
var sessionRestored = false;
function persistSession(){
  if(!accessToken) return;
  try{
    localStorage.setItem(LS_TOKEN, accessToken);
    localStorage.setItem(LS_TOKEN_EXPIRY, String(tokenExpiry));
    localStorage.setItem(LS_AUTO, '1');
  }catch(e){}
}
function clearSession(){
  try{
    localStorage.removeItem(LS_TOKEN);
    localStorage.removeItem(LS_TOKEN_EXPIRY);
    localStorage.removeItem(LS_AUTO);
  }catch(e){}
}
/* ============ サイレント再取得：先行更新と再試行 ============ */
function tokenValid(){
  return !!accessToken && Date.now() < tokenExpiry;
}
/* 期限切れ、または期限までの残りが REFRESH_MARGIN_MS 以下なら更新対象 */
function tokenNeedsRefresh(){
  if(!tokenValid()) return true;
  return (tokenExpiry - Date.now()) <= REFRESH_MARGIN_MS;
}
function resetSilentRetry(){
  silentRetryCount = 0;
  silentGaveUp = false;
  if(silentRetryTimer){ clearTimeout(silentRetryTimer); silentRetryTimer = null; }
}
/* サイレント再取得を1回試みる（実行中・再試行待ち・打ち切り後は除く） */
function requestSilentToken(){
  if(silentInFlight || silentGaveUp || silentRetryTimer) return;
  if(!tokenClient && !initTokenClient()) return;
  silentInFlight = true;
  silentAuth = true;
  try{
    tokenClient.requestAccessToken({prompt:''});
  }catch(e){
    silentInFlight = false;
    silentAuth = false;
    onSilentAuthFailure();
  }
}
/* サイレント再取得が失敗したとき：すぐにはサインインへ落とさず、
   間隔を置いて数回まで自動で再試行する。再試行を使い切り、
   なおトークンが切れている場合に限り従来どおりサインインを求める */
function onSilentAuthFailure(){
  silentInFlight = false;
  if(silentRetryTimer) return;
  if(silentRetryCount < SILENT_RETRY_DELAYS.length){
    var delay = SILENT_RETRY_DELAYS[silentRetryCount];
    silentRetryCount++;
    silentRetryTimer = setTimeout(function(){
      silentRetryTimer = null;
      /* 非表示のまま失敗が続いた分は、復帰時の autoRefresh に任せる */
      if(document.hidden) return;
      requestSilentToken();
    }, delay);
    return;
  }
  if(!tokenValid()){
    accessToken = null; tokenExpiry = 0;
    silentGaveUp = true;
    updateAuthUI();
  }
}
function restoreSession(){
  if(sessionRestored) return;
  sessionRestored = true;
  var savedToken = '', savedExpiry = 0, auto = '';
  try{
    savedToken = localStorage.getItem(LS_TOKEN) || '';
    savedExpiry = parseInt(localStorage.getItem(LS_TOKEN_EXPIRY) || '0', 10) || 0;
    auto = localStorage.getItem(LS_AUTO) || '';
  }catch(e){}
  if(savedToken && savedExpiry && Date.now() < savedExpiry){
    accessToken = savedToken;
    tokenExpiry = savedExpiry;
    updateAuthUI();
    loadRecords(true);
    loadBabySettingsFromCal();
    return;
  }
  if(auto === '1' && tokenClient){
    requestSilentToken();
  }
}
function initTokenClient(){
  if(!clientId || !window.google || !google.accounts || !google.accounts.oauth2) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: 'https://www.googleapis.com/auth/calendar.events',
    callback: function(resp){
      var wasSilent = silentAuth;
      silentAuth = false;
      silentInFlight = false;
      if(resp && resp.access_token){
        resetSilentRetry();
        accessToken = resp.access_token;
        tokenExpiry = Date.now() + (parseInt(resp.expires_in, 10) || 3600) * 1000 - 60000;
        persistSession();
        updateAuthUI();
        loadRecords(wasSilent);
        loadBabySettingsFromCal();
      } else if(wasSilent){
        onSilentAuthFailure();
      } else {
        setStatus('サインインできませんでした', true);
      }
    },
    error_callback: function(err){
      if(silentAuth){ silentAuth = false; silentInFlight = false; onSilentAuthFailure(); return; }
      setStatus('サインインでエラーが発生しました' + (err && err.message ? '：' + err.message : ''), true);
    }
  });
  return true;
}
function signIn(){
  ensureAudio();
  resetSilentRetry();
  if(!clientId){
    openBabySettings();
    return;
  }
  if(!tokenClient && !initTokenClient()){
    setStatus('Googleの準備中です。数秒待ってからもう一度押してください', true);
    var tries = 0;
    var iv = setInterval(function(){
      tries++;
      if(initTokenClient()){ clearInterval(iv); tokenClient.requestAccessToken({prompt:''}); }
      else if(tries > 20){ clearInterval(iv); setStatus('Googleに接続できませんでした。通信環境を確認してください', true); }
    }, 500);
    return;
  }
  tokenClient.requestAccessToken({ prompt: '' });
}
$('signinBtn').addEventListener('click', signIn);
$('signoutBtn').addEventListener('click', function(){
  if(accessToken && window.google && google.accounts && google.accounts.oauth2){
    google.accounts.oauth2.revoke(accessToken, function(){});
  }
  clearSession();
  resetSilentRetry();
  accessToken = null; tokenExpiry = 0; records = [];
  renderAll(); updateAuthUI(); setStatus('');
});

var setRowBtns = document.querySelectorAll('.set-row[data-edit]');
for(var sr=0; sr<setRowBtns.length; sr++){

    var f = this.getAttribute('data-edit');

    for(var k=0;k<eds.length;k++) eds[k].classList.add('hidden');

      /* 開くときは、その項目の現在の値を入力欄に入れた状態にする */
      if(f === 'birthWeight') $('inputBirthWeight').value = babySettings.birthWeight || '';
      if(f === 'weight') $('inputWeight').value = babySettings.weight || '';

      var inp = ed.querySelector('input');

        /* フォーカスでシートがスクロールしないよう preventScroll を使う。
           日付ピッカーは生年月日のときだけ開く */
        try{ inp.focus({ preventScroll:true }); }
        catch(e){ try{ inp.focus(); }catch(e2){} }
        if(inp.type === 'date'){ try{ if(inp.showPicker) inp.showPicker(); }catch(e){} }
      }
    }
  });
}
function closeSetEditor(field){
  var ed = $('editor-' + field);
  if(ed) ed.classList.add('hidden');
}
$('inputBirthDate').addEventListener('change', function(){
  babySettings.birthDate = this.value || '';

/* 出生体重・現在の体重は、TOPの体重と同じく「保存する」ボタンを
   押したときにだけ保存し、保存と同時に入力欄を閉じる
   （入力しただけ・フォーカスを外しただけでは保存しない） */
$('saveBirthWeightBtn').addEventListener('click', function(){

  closeSetEditor('birthWeight');

$('saveWeightBtn').addEventListener('click', function(){

  if(v !== '') pushWeightLog(parseInt(v, 10));
  scheduleBabySave();

/* キャンセル：保存せずに入力欄を閉じるだけにする */
$('cancelBirthWeightBtn').addEventListener('click', function(){ closeSetEditor('birthWeight'); });
$('cancelWeightBtn').addEventListener('click', function(){ closeSetEditor('weight'); });
/* 目標の直接入力：mlと回数の両方が正の整数のときだけ保存し、
   保存と同時に入力欄を閉じる（他の項目と同じルール）。
   どちらか不正なときは保存せず、入力欄を開いたままにする */
$('saveGoalBtn').addEventListener('click', function(){

  var times = parseInt($('inputGoalTimes').value, 10);
  if(!(ml > 0) || !(times > 0)) return;
  babySettings.goalMl = ml;
  babySettings.goalTimes = times;
  babySettings.goalBand = '';

  closeSetEditor('goal');

/* 目標を未設定に戻す：従来どおり月齢から自動で決まる動作になる */
$('clearGoalBtn').addEventListener('click', function(){
  babySettings.goalMl = '';

  babySettings.goalBand = '';
  scheduleBabySave();
  closeSetEditor('goal');
});
$('remindToggle').addEventListener('click', function(){
  babySettings.remind = !babySettings.remind;
  scheduleBabySave();
  /* トグルの切り替えは60秒待たずに即時反映する：
     ONなら目安時刻の予定を登録、OFFなら登録済みの予定を消す。
     記録変更のデバウンス待機が残っていれば取り消す */
  cancelDelayedReminderSync();
  scheduleSyncReminder();
});
$('cancelSettingsBtn').addEventListener('click', function(){ closeBabySettings(); });
$('saveSettingsBtn').addEventListener('click', function(){
  var cid = $('clientIdInput').value.trim();
  var cal = $('calendarIdInput').value.trim() || DEFAULT_CAL;
  if(!cid){ setStatus('クライアントIDを入力してください', true); return; }
  clientId = cid; calendarId = cal;
  try{
    localStorage.setItem(LS_CID, clientId);
    localStorage.setItem(LS_CAL, calendarId);
  }catch(e){}
  clearSession();
  resetSilentRetry();
  accessToken = null; tokenExpiry = 0; tokenClient = null;
  settingsEventId = null; settingsEventRaw = null;
  closeBabySettings();
  updateAuthUI();
  setStatus('設定を保存しました。「Googleでサインイン」を押してください');
});

/* ================= 自動更新（相手の変更を反映） ================= */
function autoRefresh(){
  if(document.hidden) return;
  if(busy) return;
  if(!$('editOverlay').classList.contains('hidden')) return;
  if(!$('dayOverlay').classList.contains('hidden')) return;
  if(!$('babyOverlay').classList.contains('hidden')) return;
  if(!$('topWeightEditor').classList.contains('hidden')) return;
  if(!$('monthOverlay').classList.contains('hidden')) return;
  if(!$('allMonthsOverlay').classList.contains('hidden')) return;
  if(!$('viewerOverlay').classList.contains('hidden')) return;
  if(tokenValid()){
    /* 期限までの残りが少ないときは、切れる前に先に裏で取り直す。
       その間も今のトークンで読み込みは続ける */
    if(tokenNeedsRefresh()) requestSilentToken();
    loadRecords(true);
    loadBabySettingsFromCal();
  } else if(tokenClient){
    requestSilentToken();
  }
}
setInterval(autoRefresh, 30000);
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) autoRefresh();
});
window.addEventListener('focus', function(){ autoRefresh(); });

      tries++;
      if(initTokenClient()){ clearInterval(iv); restoreSession(); }
      else if(tries > 20) clearInterval(iv);
    }, 500);
  }
});
document.addEventListener('pointerdown', ensureAudio, { once:false });
})();
