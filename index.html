<style>
  :root{
    --green:#3fbf4f; --green-dark:#2ea63e; --green-soft:#e8f9ec;
    --ink:#333840; --ink-sub:#7a8288;
    --page:#eef1ee; --bg:#f7f8f7; --card:#ffffff; --line:#e9ede9;
    --pee-bg:#d9f1fb; --pee:#2f83b8;
    --poop-bg:#f3e4d3; --poop:#96692f;
    --breast-bg:#fbe0ec; --breast:#d14f86;
    --milk-bg:#fdefc0; --milk:#a97b06;
    /* 今日の強調は7日間・月間とも緑系で統一する（黄色はミルク専用） */
    --today-tint:rgba(63,191,79,.10); --today-ink:#2ea63e;
    --coral:#e05252;
    --sun:#e56b6b; --sat:#5b8dd9;
    --shadow:0 2px 12px rgba(60,80,60,.07), 0 1px 3px rgba(60,80,60,.05);
    /* ===== 共通寸法（余白・角丸・文字・ボタンの高さ） ===== */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
    --r-s:10px; --r-m:14px; --r-l:20px; --pill:999px;
    --fs-1:11px; --fs-2:13px; --fs-3:15px; --fs-4:17px;
    --btn-h:36px; --btn-h-lg:44px;
    --err-bg:#fdecec;
    --head-ink:var(--ink-sub); --head-milk:var(--milk); --head-diaper:var(--pee);
  }
  body.no-scroll{overflow:hidden;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; overflow-x:hidden; max-width:100%;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--page); color:var(--ink);
    font-family:"M PLUS Rounded 1c",system-ui,-apple-system,"Hiragino Maru Gothic ProN",sans-serif;
    font-weight:500; min-height:100vh; overflow-x:hidden; width:100%;
  }
  svg,img{max-width:100%;}
  input,select,textarea{max-width:100%; min-width:0;}
  button{font-family:inherit; cursor:pointer; border:none; color:inherit; background:none;}
  button:disabled{opacity:.45; cursor:not-allowed;}
  .wrap{max-width:672px; width:100%; margin:0 auto; padding:8px 12px 32px; overflow-x:clip; background:var(--bg);}
  .hidden{display:none !important;}

  /* ===== ヘッダー（明るい緑） ===== */
  .app-header{
    background:linear-gradient(180deg,#47c657 0%, var(--green) 55%, #38b547 100%);
    color:#fff;
    border-radius:0 0 18px 18px;
    padding:calc(env(safe-area-inset-top, 0px) + 7px) 14px 9px;
    max-width:672px; margin:0 auto;
    box-shadow:0 2px 10px rgba(46,166,62,.25);
  }
  .now{
    font-size:13px; text-align:center; margin:0; font-weight:800;
    letter-spacing:.03em; font-variant-numeric:tabular-nums;
    text-shadow:0 1px 2px rgba(0,90,20,.18); line-height:1.3; white-space:nowrap;
  }
  .baby-row{display:flex; align-items:center; gap:9px; margin-top:5px; min-width:0;}
  .baby-face{
    width:32px; height:32px; flex:0 0 auto;
    background:#fff; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(0,90,20,.18);
  }
  .baby-face svg{width:30px; height:30px;}
  /* 曜日だけに付ける土日の色（日付の数字には付けない・月間カレンダーと同じ色）。
     .wk-head .wk-wd や .day-row .dcell .wd のような文脈側のグレーが
     単独クラス指定に勝って色が消えないよう、文脈つきでも明示する */
  .wd-sun{color:var(--sun);}
  .wd-sat{color:var(--sat);}
  .wk-head .wk-wd.wd-sun{color:var(--sun);}
  .wk-head .wk-wd.wd-sat{color:var(--sat);}
  .day-row .dcell .wd.wd-sun{color:var(--sun);}
  .day-row .dcell .wd.wd-sat{color:var(--sat);}
  /* ヘッダー（緑背景）では白文字と見分けがつく濃さの赤／青にする */
  .now .wd-sun{color:#ff7d7d;}
  .now .wd-sat{color:#74b9ff;}
  .baby-summary{display:flex; align-items:baseline; gap:8px; min-width:0; white-space:nowrap; overflow:hidden;}
  .baby-age{font-size:15px; font-weight:800; line-height:1.2; white-space:nowrap;}
  .baby-weight{font-size:11px; font-weight:700; opacity:.92; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .baby-summary .unset{font-size:13px; font-weight:700; opacity:.92;}
  .weight-edit{
    position:relative;
    width:36px; height:36px; min-height:36px;
    border:none; border-radius:50%;
    background:rgba(255,255,255,.18); color:#fff;
    display:flex; align-items:center; justify-content:center;
    padding:0; flex:0 0 auto;
  }
  .weight-edit svg{width:15px; height:15px;}
  .weight-edit:active{background:rgba(255,255,255,.32);}
  .weight-edit.recorded::after{
    content:'✓'; position:absolute; top:-6px; right:-7px;
    width:14px; height:14px; border-radius:50%;
    background:#fff; color:var(--green-dark);
    font-size:9px; font-weight:800; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 3px rgba(0,90,20,.3);
  }
  .hdr-right{margin-left:auto; display:flex; align-items:center; gap:8px; flex:0 0 auto;}
  .hdr-icon{
    width:36px; height:36px; min-height:36px;
    border:none; border-radius:50%;
    background:rgba(255,255,255,.18); color:#fff;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .hdr-icon svg{width:15px; height:15px;}
  .hdr-icon:active{background:rgba(255,255,255,.32);}
  .settings-btn{
    border:none; border-radius:999px;
    background:rgba(255,255,255,.18); color:#fff;
    display:flex; align-items:center; gap:4px;
    padding:5px 10px; font-size:11px; font-weight:800;
    min-height:36px; white-space:nowrap;
  }
  .settings-btn svg{width:14px; height:14px;}
  .settings-btn:active{background:rgba(255,255,255,.32);}


  /* ===== サインイン・状態表示 ===== */
  .topbar{display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap; margin:2px 0 3px;}
  .btn-signin{
    background:#fff; color:var(--ink); font-weight:800; font-size:14px;
    border-radius:999px; padding:9px 18px; display:inline-flex; align-items:center; gap:8px;
    border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .btn-ghost{
    background:#fff; color:var(--ink-sub); font-weight:700; font-size:13px;
    border:1px solid var(--line); border-radius:999px; padding:8px 14px;
  }
  .signed{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-sub);}
  .signed .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;}
  .authbar{display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap;}
  .status{font-size:13px; color:var(--ink-sub); text-align:center; min-height:18px; margin:0 0 2px;}
  .status:empty{min-height:0; margin:0;}
  .status.err{color:var(--coral);}
  footer{margin-top:16px; text-align:center;}

  /* ===== カード ===== */
  .panel{
    background:var(--card); border-radius:16px; box-shadow:var(--shadow);
    padding:10px 12px; margin-bottom:8px; min-width:0; max-width:100%;
  }
  .card-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:7px;}
  .card-title{font-size:13px; font-weight:800; color:var(--ink);}
  .sec-head{display:flex; align-items:center; gap:7px; margin:6px 2px 3px; font-size:13px; font-weight:800; color:var(--ink);}

  /* ===== 共通ボタン ===== */
  .btn-primary{
    background:var(--green); color:#fff; font-weight:800; font-size:15px;
    border-radius:12px; padding:11px 18px; width:100%; margin-top:14px; min-height:var(--btn-h-lg);
  }
  .btn-primary:active{background:var(--green-dark);}
  .btn-sub{
    background:#fff; color:var(--ink-sub); font-weight:700; font-size:13px;
    border:1px solid var(--line); border-radius:10px; padding:9px 14px; width:100%; margin-top:8px; min-height:var(--btn-h);
  }
  /* 「もっと見る」も副ボタン（白＋枠線・13px・角丸10・高さ36）に統一 */
  .btn-more{
    display:block; margin:8px auto 2px;
    background:#fff; color:var(--ink-sub); font-weight:700; font-size:13px;
    border:1px solid var(--line); border-radius:10px;
    padding:9px 14px; min-height:var(--btn-h);
  }
  .btn-more:active{background:var(--green-soft);}
  /* 削除ボタンは副ボタンの寸法で、色だけ赤系にする例外 */
  .btn-danger{
    background:#fff; color:var(--coral); border:1px solid rgba(224,82,82,.5);
    font-weight:700; font-size:13px; border-radius:10px; padding:9px 14px; width:100%; margin-top:8px; min-height:var(--btn-h);
  }
  .btn-danger.confirm{background:#c0392b; color:#fff; border-color:#c0392b;}
  .nav-row{display:flex; gap:8px; margin-top:10px;}
  /* 週・月の前後ボタンも副ボタンの寸法・色に統一 */
  .nav-btn{
    flex:1; border:1px solid var(--line); background:#fff;
    color:var(--ink-sub); font-size:13px; font-weight:700;
    border-radius:10px; padding:9px 14px; min-height:var(--btn-h);
  }
  .nav-btn:active{background:var(--green-soft);}
  .nav-btn:disabled{background:#f0f3f0; border-color:#f0f3f0; color:#b6bcb6; opacity:1;}

  /* ===== 記録時間ブロック ===== */
  .rectime{padding:8px 10px;}
  .rectime-toggle{display:flex; background:#fff; border:1px solid var(--line); border-radius:999px; padding:3px; gap:3px; min-width:0;}
  .rt-opt{
    flex:1 1 0; min-width:0; background:#fff; color:var(--ink-sub);
    border-radius:999px; padding:4px 0; min-height:36px;
    font-size:12px; font-weight:800; text-align:center;
  }
  .rt-opt.sel{background:var(--green); color:#fff; box-shadow:none;}
  .rectime-set{padding-top:8px;}
  .rt-date{font-size:15px; font-weight:800; color:var(--ink); text-align:center; min-height:1.3em; font-variant-numeric:tabular-nums;}
  .rt-controls{display:flex; align-items:center; justify-content:center; gap:12px; margin-top:2px;}
  .rt-group{display:flex; align-items:center; gap:8px;}
  .rt-step{
    width:36px; height:36px; min-height:36px; border-radius:50%; background:#fff; color:var(--green-dark);
    border:1px solid var(--line); font-size:16px; font-weight:800; line-height:1;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .rt-step:active{background:var(--green); border-color:var(--green); color:#fff;}
  .rt-num{font-size:20px; font-weight:800; min-width:2ch; text-align:center; font-variant-numeric:tabular-nums;}
  .rt-colon{font-size:20px; font-weight:800;}

  /* ===== 記録ボタン（おしっこ・うんち・母乳・ミルクを横1行） ===== */
  .rec-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); column-gap:6px; row-gap:3px; min-width:0;}
  .round-btn{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; padding:0; min-width:0; width:100%;
  }
  .round-btn .disc{
    width:54px; height:54px; flex:0 0 auto;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:transform .08s ease; position:relative;
  }
  .round-btn .disc svg{width:43px; height:43px; display:block;}
  .round-btn:active .disc{transform:scale(.93);}
  .round-btn .lbl{font-size:12px; font-weight:800; color:var(--ink); line-height:1.25; white-space:nowrap;}
  .disc.pee{background:var(--pee-bg);}
  .disc.poop{background:var(--poop-bg);}
  .disc.breast{background:var(--breast-bg);}
  .disc.milk{background:var(--milk-bg);}
  /* 前回の表示：ボタンの下に同じ1行でそろえる（3か所とも同じ大きさ・色で、各ボタンの中央）。
     授乳分は母乳・ミルク2ボタンの下にまとめて1つだけ置き、「次」だけ緑で強調する */
  .rec-last{
    font-size:11px; font-weight:700; color:var(--ink-sub);
    font-variant-numeric:tabular-nums; line-height:1.3;
    text-align:center; min-width:0;
  }
  .rec-feed-last{grid-column:3 / span 2; display:flex; align-items:center; justify-content:center; gap:7px; flex-wrap:wrap;}
  .rec-feed-last .next{color:var(--today-ink); font-weight:800; display:inline-flex; align-items:center; gap:3px;}
  .next-bell{flex:0 0 auto; width:14px; height:14px; display:inline-flex; align-items:center; justify-content:center; color:var(--today-ink);}
  .next-bell svg{width:14px; height:14px;}

  /* ===== 小さなポップアップ（中央モーダル・全入力共通部品） =====
     見出し＋×、エラー表示、フッター（保存系／キャンセル）の作法をここで統一する */
  .pop-sheet{
    background:#fff; color:var(--ink); width:100%; max-width:340px; min-width:0;
    max-height:86vh; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
    border-radius:var(--r-l); padding:18px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow:0 12px 32px rgba(60,80,60,.25);
  }
  .pop-sheet.edit-pop{max-width:400px;}
  .pop-head{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .pop-title{font-size:16px; font-weight:800;}
  .pop-sheet .close-x{margin-left:auto; background:transparent; color:var(--ink-sub); font-size:20px; line-height:1; padding:4px 8px;}
  .pop-sheet label{display:block; font-size:13px; font-weight:700; color:var(--ink-sub); margin:10px 0 6px;}
  .pop-foot{margin-top:14px;}
  .pop-foot .btn-primary{margin-top:0;}
  .pop-foot .btn-sub, .pop-foot .btn-danger{margin-top:8px;}
  /* 記録の編集：日付と時刻を1行に横並びにし、左右のバランスをそろえる */
  .edit-datetime-row{display:flex; gap:10px; align-items:flex-start; width:100%;}
  .edit-dt-field{flex:1 1 0; min-width:0;}
  .edit-dt-field label{margin:0 0 6px;}
  .edit-dt-field input{width:100%; text-align:center; padding-left:6px; padding-right:6px;}
  /* ミルクの量ポップアップの中身 */
  .milk-step-row{display:flex; align-items:center; justify-content:center; gap:18px;}
  .milk-amt{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; min-width:3ch; text-align:center; line-height:1.1;}
  .milk-amt .milk-amt-unit{font-size:14px; font-weight:800; margin-left:2px;}

  /* ===== 今日のミルク ゲージ ===== */
  .gauge-top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
  .gauge-main{font-size:13px; font-weight:800;}
  .gauge-main b{font-size:17px; font-variant-numeric:tabular-nums;}
  .gauge-goal{font-size:11px; font-weight:700; color:var(--ink-sub); font-variant-numeric:tabular-nums;}
  /* TOPのミルクの目標：鉛筆付きのタップ領域にして、押すと目標の編集が開く */
  .gauge-goal-btn{
    display:inline-flex; align-items:center; gap:4px; flex:0 0 auto;
    background:none; border:none; padding:5px 2px; margin:-5px -2px;
    font-family:inherit; text-align:right;
  }
  .gauge-goal-btn:active{opacity:.6;}
  .gauge-goal-pencil{width:13px; height:13px; display:inline-flex; align-items:center; justify-content:center; color:var(--green-dark); flex:0 0 auto;}
  .gauge-goal-pencil svg{width:13px; height:13px; display:block;}
  .gauge-track{height:10px; background:#f1f2f0; border-radius:999px; overflow:hidden;}
  .gauge-fill{height:100%; width:0; background:linear-gradient(90deg,#ffd94d,#ffc61a); border-radius:999px; transition:width .3s ease;}

  /* ===== 今日のログ（タイムライン） ===== */
  .rec-list{display:flex; flex-direction:column; position:relative;}
  .rec-list::before{
    content:""; position:absolute;
    left:calc(46px + 8px + 13px); top:10px; bottom:10px;
    width:2px; background:var(--line); transform:translateX(-1px);
  }
  .rec-row{
    display:grid; grid-template-columns:46px 26px minmax(0,1fr);
    align-items:center; column-gap:8px;
    width:100%; max-width:100%; min-width:0; text-align:left;
    background:transparent; padding:5px 0; border-bottom:1px solid var(--line);
    position:relative;
  }
  .rec-row:last-child{border-bottom:none;}
  .rec-row:active{background:#fafbfa;}
  .rec-time{font-variant-numeric:tabular-nums; text-align:right; line-height:1.2; font-size:13px; font-weight:700; color:var(--ink-sub);}
  .rec-time .d{display:block; font-size:9px; font-weight:700; color:var(--ink-sub);}
  .rec-time .h{font-size:inherit; font-weight:inherit; color:inherit;}
  .rec-time .m{font-size:inherit; font-weight:inherit; color:inherit;}
  .badge{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    position:relative; z-index:1;
  }
  .badge svg{width:21px; height:21px; display:block;}
  .badge.pee{background:var(--pee-bg);}
  .badge.poop{background:var(--poop-bg);}
  .badge.breast{background:var(--breast-bg);}
  .badge.milk{background:var(--milk-bg);}
  .badge.memo{background:#eef0ee; color:#7a8288;}
  .badge.memo svg{width:15px; height:15px;}
  .rec-title{font-size:13px; font-weight:800; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .empty{font-size:14px; color:var(--ink-sub); padding:5px 2px;}

  /* ===== メモ（TOPは細い1行だけに抑え、入力は小さなポップアップで） ===== */
  .memo-panel{padding-top:6px; padding-bottom:6px;}
  .memo-open{
    display:flex; align-items:center; gap:8px; width:100%;
    min-height:36px; padding:0; text-align:left;
    font-size:13px; font-weight:800; color:var(--ink);
  }
  .memo-open .memo-ic{width:19px; height:19px; color:var(--ink-sub); display:inline-flex; flex:0 0 auto;}
  .memo-open .memo-ic svg{width:19px; height:19px; display:block;}
  /* 「書く」は猫の「記録」ボタン（.cat-rec-btn）とまったく同じ見た目にする：
     白背景＋枠線・グレー文字・13px/700・角丸10・padding 9px 14px・高さ36 */
  .memo-open .memo-act{
    margin-left:auto; flex:0 0 auto;
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--line); background:#fff; color:var(--ink-sub);
    font-size:13px; font-weight:700; border-radius:10px; padding:9px 14px; min-height:36px; line-height:1.2;
  }
  .memo-open .memo-chev{color:var(--ink-sub); font-size:18px; line-height:1; flex:0 0 auto;}
  .memo-open:active{opacity:.65;}

  /* ===== 7日間ログ（グリッド：日付列×24時間行） ===== */
  .wk-grid{display:grid; grid-template-columns:26px repeat(7,minmax(0,1fr)); min-width:0;}
  .wk-corner{border-bottom:2px solid var(--line);}
  .wk-corner .wk-hidden{visibility:hidden;}
  .wk-sumicon{
    height:21px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
  }
  .wk-sumicon svg{width:16px; height:16px; flex:0 0 auto; display:block;}
  .wk-sumicon.pee{background:var(--pee-bg);}
  .wk-sumicon.poop{background:var(--poop-bg);}
  .wk-sumicon.breast{background:var(--breast-bg);}
  .wk-sumicon.milk{background:var(--milk-bg);}
  .wk-head{
    text-align:center; min-width:0;
    padding:3px 0 5px;
    border-bottom:2px solid var(--line);
  }
  .wk-head .wk-md{display:block; font-size:11px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; line-height:1.3;}
  .wk-head .wk-wd{display:block; font-size:9px; font-weight:700; color:var(--ink-sub); line-height:1.3;}
  .wk-head .wk-w{display:block; min-height:11px; font-size:9px; font-weight:700; color:var(--ink-sub); font-variant-numeric:tabular-nums; white-space:nowrap; line-height:1.3;}
  .wk-head.today-col .wk-md{color:var(--green-dark);}
  .wk-sums{display:flex; flex-direction:column; gap:2px; margin-top:4px; padding:0 1px;}
  .wk-sumrow{
    height:21px; border-radius:6px; padding:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; line-height:1.15;
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .wk-sumrow .none{opacity:.5;}
  .wk-sumrow.pee{background:var(--pee-bg); color:var(--pee);}
  .wk-sumrow.poop{background:var(--poop-bg); color:var(--poop);}
  .wk-sumrow.breast{background:var(--breast-bg); color:var(--breast);}
  .wk-sumrow.milk{background:var(--milk-bg); color:#8a6503;}
  .wk-axis{
    font-size:9px; font-weight:700; color:#b6bcb6;
    display:flex; align-items:flex-start; justify-content:center;
    padding-top:2px; font-variant-numeric:tabular-nums;
    border-bottom:1px solid #f5f6f5; min-width:0; white-space:nowrap;
  }
  .wk-axis.now-hour{color:var(--green-dark); font-weight:800;}
  .wk-cell{
    min-height:17px; border-bottom:1px solid #f5f6f5;
    display:flex; flex-wrap:wrap; gap:2px;
    align-content:flex-start; padding:2px 1px; min-width:0;
  }
  /* 今日の列と現在時刻の強調は、ミルクの黄色と混同しないよう緑系にする */
  .wk-cell.today-col{background:rgba(63,191,79,.09);}
  .wk-cell.now-hour{background:rgba(63,191,79,.09);}
  .wk-cell.now-hour.today-col{background:rgba(63,191,79,.16);}
  .wk-grid .wk-last{border-bottom:none;}
  .wk-chip{
    flex:0 0 auto; height:13px; min-width:13px;
    border-radius:999px; padding:0 2px; position:relative;
    display:inline-flex; align-items:center; justify-content:center; gap:1px;
  }
  /* 見た目は変えず、タップの当たり判定だけを上下左右に広げる */
  .wk-chip::after{content:""; position:absolute; inset:-8px -4px;}
  .wk-chip svg{width:10px; height:10px; display:block;}
  .wk-chip.pee{background:var(--pee-bg);}
  .wk-chip.poop{background:var(--poop-bg);}
  .wk-chip.breast{background:var(--breast-bg);}
  .wk-chip.milk{
    background:var(--milk-bg); color:#8a6503; padding:0 3px 0 2px;
    font-size:9px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .wk-chip.memo{background:#eef0ee; color:#7a8288;}
  .wk-chip:active{filter:brightness(.96);}
  /* 7日間ログ：列（見出し・セル）のどこを押してもその日の一覧が開く */
  .wk-head[data-dayts], .wk-cell[data-dayts]{cursor:pointer;}
  .wk-head[data-dayts]:active, .wk-cell[data-dayts]:active{background:var(--green-soft);}

  /* ===== 月間のログ ===== */
  .cal-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .cal-month{font-size:13px; font-weight:800; color:var(--ink); padding:0; display:inline-flex; align-items:center; gap:3px;}
  .cal-month .chev{color:var(--ink-sub); font-size:16px; line-height:1;}
  .cal-weight{font-size:11px; font-weight:700; color:var(--ink-sub); font-variant-numeric:tabular-nums; white-space:nowrap; display:inline-flex; align-items:center; gap:4px;}
  .cal-weight b{color:var(--ink); font-weight:800;}
  .cal-weight .w-ic, .mv-weight .w-ic{width:14px; height:14px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; color:var(--ink-sub);}
  .cal-weight .w-ic svg, .mv-weight .w-ic svg{width:14px; height:14px; display:block;}
  .mcal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px;}
  .mcal-dow{text-align:center; font-size:9px; font-weight:800; color:var(--ink-sub); padding:2px 0;}
  .mcal-dow.sun{color:var(--sun);}
  .mcal-dow.sat{color:var(--sat);}
  .mcal-day{
    text-align:center; font-size:11px; font-weight:700;
    padding:3px 0 2px; border-radius:7px;
    font-variant-numeric:tabular-nums; position:relative; color:#c9cdc9;
    width:100%; display:block;
  }
  button.mcal-day{cursor:pointer;}
  button.mcal-day:active{background:var(--green-soft);}
  .mcal-day.has{color:var(--ink);}
  .mcal-day .dot{display:block; width:4px; height:4px; border-radius:50%; background:var(--green); margin:1px auto 0;}
  .mcal-day .dot.none{background:transparent;}
  .mcal-day.today{background:var(--today-tint); color:var(--today-ink); font-weight:800;}
  .mcal-day.today .dot{background:var(--today-ink);}
  .month-stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-top:9px;}
  .mstat{border-radius:10px; padding:5px 4px; text-align:center; min-width:0;}
  .mstat .k{display:flex; align-items:center; justify-content:center; gap:3px; font-size:9px; font-weight:800;}
  .mstat .k svg{width:13px; height:13px; display:block; flex:0 0 auto;}
  .mstat .v{font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:1px; color:var(--ink);}
  .mstat.pee{background:var(--pee-bg);} .mstat.pee .k{color:var(--pee);}
  .mstat.poop{background:var(--poop-bg);} .mstat.poop .k{color:var(--poop);}
  .mstat.breast{background:var(--breast-bg);} .mstat.breast .k{color:var(--breast);}
  .mstat.milk{background:var(--milk-bg);} .mstat.milk .k{color:var(--milk);}

  /* ===== 月別・日別の一覧（シート内） ===== */
  .month-row{
    display:grid; grid-template-columns:6.6rem repeat(3,minmax(0,1fr)); gap:10px; align-items:center; min-width:0;
    width:100%; background:transparent; text-align:left;
    padding:6px 2px; border-bottom:1px solid var(--line); color:var(--ink);
  }
  .month-row:last-child{border-bottom:none;}
  .month-row:active{background:#fafbfa;}
  .month-row .month-name{font-size:15px; font-weight:800; white-space:nowrap; min-width:0;}
  .month-row .mvalue{font-size:15px; font-weight:800; white-space:nowrap; min-width:0; text-align:center;}
  .month-row .mvalue.wt{font-size:11px; white-space:normal; line-height:1.4; text-align:left; font-weight:800;}
  .months-head{
    display:grid; grid-template-columns:6.6rem repeat(3,minmax(0,1fr)); gap:10px; align-items:center; min-width:0;
    padding:1px 2px 4px; border-bottom:1px solid var(--line);
  }
  .months-head .hcell{display:flex; align-items:center; justify-content:center; min-width:0;}
  .months-head .hcell:first-child{justify-content:flex-start;}
  .months-head svg{width:22px; height:22px; flex:0 0 auto;}
  /* ===== 月間ビューワー（月ごとの体重の変化と1日平均をシンプルに並べる） ===== */
  .month-view-row{
    display:block; width:100%; background:transparent; text-align:left;
    padding:10px 2px 12px; border-bottom:1px solid var(--line); color:var(--ink); min-width:0;
  }
  .month-view-row:last-child{border-bottom:none;}
  .month-view-row:active{background:#fafbfa;}
  .mv-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; min-width:0;}
  .mv-name{font-size:15px; font-weight:800; white-space:nowrap;}
  .mv-weight{font-size:11px; font-weight:700; color:var(--ink-sub); font-variant-numeric:tabular-nums; white-space:nowrap; display:inline-flex; align-items:center; gap:4px;}
  .mv-weight b{color:var(--ink); font-weight:800;}
  .mv-stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-top:7px;}
  .mv-stat{border-radius:10px; padding:5px 4px; text-align:center; min-width:0; display:block;}
  .mv-stat .k{display:flex; align-items:center; justify-content:center; gap:3px; font-size:9px; font-weight:800;}
  .mv-stat .k svg{width:13px; height:13px; display:block; flex:0 0 auto;}
  .mv-stat .v{display:block; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:1px; color:var(--ink);}
  .mv-stat.pee{background:var(--pee-bg);} .mv-stat.pee .k{color:var(--pee);}
  .mv-stat.poop{background:var(--poop-bg);} .mv-stat.poop .k{color:var(--poop);}
  .mv-stat.breast{background:var(--breast-bg);} .mv-stat.breast .k{color:var(--breast);}
  .mv-stat.milk{background:var(--milk-bg);} .mv-stat.milk .k{color:var(--milk);}
  .day-row{
    display:grid; grid-template-columns:3.4rem repeat(4,minmax(0,1fr)); align-items:center; min-width:0;
    width:100%; background:transparent; text-align:center; padding:5px 2px;
    border-bottom:1px solid var(--line); font-size:15px; font-weight:700; color:var(--ink);
  }
  .day-row>*{min-width:0;}
  .day-row:last-child{border-bottom:none;}
  .day-row:active{background:#fafbfa;}
  .day-row .dcell{text-align:left; line-height:1.25; padding-left:2px;}
  .day-row .dcell .md{font-size:15px; font-weight:800; display:block;}
  .day-row .dcell .wd{font-size:12px; color:var(--ink-sub); font-weight:700; display:block;}
  .day-row .dcell .wline{font-size:10.5px; color:var(--ink); font-weight:700; display:block; white-space:nowrap; letter-spacing:-0.03em; margin-top:1px;}
  .day-row .dcell .wline .wdiff{color:var(--ink-sub); font-weight:700;}
  .day-row .dcell .wline .wdiff.neg{color:var(--ink-sub);}
  .day-row .num{text-align:center;}
  /* 日別一覧の授乳の数は種類色で示す（黄色はミルクだけ） */
  .day-row .hl{color:var(--milk); font-weight:800;}
  .day-row .hlb{color:var(--breast); font-weight:800;}
  .days-head{
    display:grid; grid-template-columns:3.4rem repeat(4,minmax(0,1fr)); align-items:center; min-width:0;
    padding:1px 2px 4px; border-bottom:1px solid var(--line);
  }
  .days-head .hcell{display:flex; align-items:center; justify-content:center; min-width:0;}
  .days-head svg{width:22px; height:22px;}
  .day-total{display:flex; gap:14px; flex-wrap:wrap; font-size:13.5px; color:var(--ink-sub); margin-bottom:8px; font-weight:700;}
  .day-total:empty{display:none;}
  .day-total .hl{color:var(--ink); font-weight:800;}
  .day-total .neg{color:var(--ink-sub); font-weight:800;}

  /* ===== 猫の体重 ===== */
  .cat-block{padding:5px 0; border-bottom:1px solid var(--line); min-width:0;}
  .cat-block:last-child{border-bottom:none; padding-bottom:2px;}
  .cat-head{display:flex; align-items:center; gap:9px; min-width:0; padding:2px 0;}
  .cat-ava{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; overflow:hidden;
    box-shadow:0 1px 4px rgba(90,70,40,.14), inset 0 -5px 9px rgba(120,90,40,.06), inset 0 3px 6px rgba(255,255,255,.7);
  }
  .cat-ava.mii{background:radial-gradient(circle at 35% 30%, #fff6e8 0%, #ffe9cf 55%, #ffdfba 100%);}
  .cat-ava.nari{background:radial-gradient(circle at 35% 30%, #ffffff 0%, #f3f0ea 55%, #e9e2d4 100%);}
  .cat-ava svg{width:88%; height:88%; display:block;}
  /* 猫の記録ボタンも副ボタン（白＋枠線・13px・角丸10・高さ36）に統一 */
  .cat-rec-btn{
    margin-left:auto; flex:0 0 auto;
    border:1px solid var(--line); background:#fff; color:var(--ink-sub);
    font-size:13px; font-weight:700; border-radius:10px; padding:9px 14px; min-height:36px;
  }
  .cat-rec-btn:active{background:var(--green-soft);}
  .cat-name{font-size:13px; font-weight:800; flex:0 0 auto;}
  .cat-age{font-size:12px; font-weight:700; color:var(--ink-sub); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .cat-latest{font-size:12px; font-weight:800; color:var(--ink-sub); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .cat-latest.unset{font-weight:700;}

  /* ===== 入力欄の共通スタイル（全ポップアップ・全シートで統一：
     白背景・1px枠線・角丸10・16px） ===== */
  .pop-sheet input,
  .sheet input{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font-size:16px; padding:10px 12px; font-family:inherit;
  }
  .pop-sheet input{ width:100%; }
  /* 数値欄＋単位の横並び */
  .num-unit-row{display:flex; align-items:center; gap:8px;}
  .num-unit-row input{flex:1 1 auto; min-width:0;}
  .num-unit-row .unit-label{font-size:15px; font-weight:800; flex:0 0 auto;}

  /* ===== シート（モーダル） ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(40,55,40,.45); z-index:50;
    display:flex; align-items:flex-end; justify-content:center; overflow-x:hidden; max-width:100%;
  }
  .sheet{
    background:#fff; color:var(--ink); width:100%; max-width:672px; min-width:0;
    max-height:86vh; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
    border-radius:var(--r-l) var(--r-l) 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 24px rgba(60,80,60,.14);
  }
  /* シート共通：見出しは上に、主要ボタンは下部フッターに固定する */
  .sheet > h3{position:sticky; top:-18px; background:#fff; z-index:2; padding:2px 0 8px; margin-bottom:4px;}
  .sheet-foot{
    position:sticky; bottom:calc(-18px - env(safe-area-inset-bottom)); z-index:2;
    background:#fff; padding:10px 0 2px; margin-top:12px;
  }
  .sheet-foot .btn-primary, .sheet-foot .btn-danger{margin-top:8px;}
  .sheet-foot .btn-primary:first-child, .sheet-foot .btn-danger:first-child{margin-top:0;}
  .sheet-foot .btn-sub{margin-top:8px;}
  .sheet-error{
    background:var(--err-bg); color:var(--coral); border-radius:var(--r-s);
    font-size:var(--fs-2); font-weight:700; line-height:1.5;
    padding:9px 12px; margin:0 0 10px; overflow-wrap:anywhere;
  }
  .load-note{
    font-size:var(--fs-1); font-weight:800; color:var(--green-dark);
    background:var(--green-soft); border-radius:var(--pill);
    padding:5px 12px; margin:0 0 8px; text-align:center;
  }
  .sheet h3{font-size:16px; font-weight:800; margin:0 0 12px; display:flex; align-items:center; gap:8px;}
  .sheet h3 svg{width:24px; height:24px;}
  .sheet .close-x{margin-left:auto; background:transparent; color:var(--ink-sub); font-size:20px; line-height:1; padding:4px 8px;}
  .sheet label{display:block; font-size:13px; font-weight:700; color:var(--ink-sub); margin:10px 0 6px;}
  .sheet input[type="datetime-local"],
  .sheet input[type="text"]{ width:100%; }
  .opt-row{display:flex; gap:8px; flex-wrap:wrap;}
  .opt{
    display:inline-flex; align-items:center; gap:6px; border-radius:14px; padding:10px 14px;
    font-size:15px; font-weight:800; border:2px solid transparent; background:var(--bg); color:var(--ink);
  }
  .opt svg{width:22px; height:22px;}
  .opt.sel{border-color:var(--green);}
  .opt.pee{background:var(--pee-bg);}
  .opt.poop{background:var(--poop-bg);}
  .opt.breast{background:var(--breast-bg);}
  .opt.milk{background:var(--milk-bg);}
  .milk-custom{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .milk-custom input{ flex:1; min-width:0; }
  .milk-custom .milk-unit{font-size:15px; font-weight:800; color:var(--ink); flex:0 0 auto;}

  /* ===== アップデートのお知らせ（中央モーダル） ===== */
  .overlay.center{align-items:center; padding:20px 16px; overflow-y:auto;}
  .update-sheet{
    background:#fff; color:var(--ink); width:100%; max-width:480px; min-width:0;
    max-height:86vh; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
    border-radius:var(--r-l); padding:20px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 12px 32px rgba(60,80,60,.25);
  }
  .update-sheet .sheet-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .update-sheet .sheet-title{font-size:16px; font-weight:800;}
  .update-sheet .close-x{margin-left:auto; background:transparent; color:var(--ink-sub); font-size:20px; line-height:1; padding:4px 8px;}
  .update-sheet .sheet-foot{bottom:calc(-18px - env(safe-area-inset-bottom));}
  /* お知らせはカテゴリごとに見出し（色つきアイコン）で区切って並べる */
  .upd-cat{margin-top:14px;}
  .upd-cat:first-child{margin-top:2px;}
  .upd-cat-head{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:800; color:var(--ink);}
  .upd-cat-ic{width:24px; height:24px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .upd-cat-ic svg{width:15px; height:15px; display:block;}
  .upd-list{list-style:none; margin:5px 0 0; padding:0;}
  .upd-list li{
    font-size:14px; font-weight:700; line-height:1.6; color:var(--ink);
    padding:2px 0 2px 31px; position:relative; overflow-wrap:anywhere;
  }
  .upd-list li::before{content:""; position:absolute; left:11px; top:.74em; width:5px; height:5px; border-radius:50%; background:#c9cdc9;}

  /* ===== 設定シート ===== */
  .set-row{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-top:6px; font-size:15px; color:var(--ink);
  }
  .set-row .set-label{font-weight:700; color:var(--ink); flex:0 0 auto;}
  .set-row .set-value{flex:1; min-width:0; text-align:right; font-weight:800; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .set-row .set-value.unset{color:var(--ink-sub); font-weight:700;}
  .set-row .set-chev{color:var(--ink-sub); font-size:20px; font-weight:400; line-height:1; flex:0 0 auto;}
  .age-table{margin-top:6px; border:1px solid var(--line); border-radius:16px; overflow:hidden; max-width:100%;}
  .age-row{display:flex; gap:10px; padding:8px 14px; background:#fff; border-bottom:1px solid var(--line); font-size:13.5px; align-items:center; min-width:0; width:100%; text-align:left; font-family:inherit; cursor:pointer;}
  .age-row:last-child{border-bottom:none;}
  .age-row .age-label{color:var(--ink-sub); font-weight:700; flex:0 1 6.2em; min-width:0;}
  .age-row .age-value{color:var(--ink); font-weight:700; flex:1; min-width:0; overflow-wrap:anywhere;}
  /* 選択中の行は緑の枠と太字＋✓で明確に分かるようにする */
  .age-row.sel{background:var(--green-soft); box-shadow:inset 0 0 0 2px var(--green);}
  .age-row.sel .age-label{color:var(--green-dark); font-weight:800;}
  .age-row.sel .age-value{color:var(--green-dark); font-weight:800;}
  .age-sel{flex:0 0 auto; color:var(--green-dark); font-size:15px; font-weight:800;}
  .age-rec{flex:0 0 auto; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;}
  .age-rec svg{width:20px; height:20px; display:block;}
  .goal-inputs{display:flex; gap:8px;}
  .goal-field{flex:1 1 0; min-width:0; display:flex; align-items:center; gap:6px;}
  .goal-field input{flex:1; min-width:0;}
  .goal-field .goal-unit{flex:0 0 auto; font-size:14px; font-weight:800; color:var(--ink-sub);}
  .toggle-row{display:flex; align-items:center; gap:10px; margin-top:6px; background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:9px 12px;}
  .toggle-row .t-label{flex:1; min-width:0; font-size:15px; font-weight:700;}
  .toggle-row .t-state{font-size:13px; color:var(--ink-sub); font-weight:700;}
  .switch{flex:0 0 auto; width:50px; height:28px; border-radius:999px; background:#d8dcd8; position:relative; padding:0;}
  .switch .knob{
    position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff;
    transition:left .15s ease; box-shadow:0 1px 3px rgba(60,80,60,.25);
  }
  .switch.on{background:var(--green);}
  .switch.on .knob{left:25px;}
  .sheet-sec-label{font-size:13px; font-weight:700; color:var(--ink-sub); margin:12px 0 0;}


  /* ===== 押し心地アニメーション ===== */
  @keyframes pop{
    0%{ transform:scale(1); }
    35%{ transform:scale(.86); }
    65%{ transform:scale(1.07); }
    100%{ transform:scale(1); }
  }
  .anim-pop{ animation:pop .34s cubic-bezier(.34,1.4,.64,1); }
  @media (prefers-reduced-motion: reduce){
    .anim-pop{ animation:none; }
    .round-btn:active .disc{ transform:none; }
  }

  /* ===== 狭幅端末（〜430px） ===== */
  @media (max-width:430px){
    .wrap{padding:8px 10px 28px;}
    .panel{padding:9px 10px; border-radius:14px;}
    .app-header{padding-left:12px; padding-right:12px;}
    .now{font-size:12px;}
    .baby-age{font-size:14px;}
    .month-row{grid-template-columns:6rem repeat(3,minmax(0,1fr)); gap:8px;}
    .months-head{grid-template-columns:6rem repeat(3,minmax(0,1fr)); gap:8px;}
    .month-row .month-name{font-size:14px;}
    .month-row .mvalue{font-size:14px;}
    .month-row .mvalue.wt{font-size:10.5px;}
    .sheet{padding:16px 12px calc(16px + env(safe-area-inset-bottom));}
    .pop-sheet{padding:16px 12px calc(14px + env(safe-area-inset-bottom));}
    .overlay.center{padding:16px 10px;}
    .update-sheet{padding:16px 12px calc(16px + env(safe-area-inset-bottom)); border-radius:var(--r-l);}
    .sheet > h3{top:-16px;}
    .sheet-foot{bottom:calc(-16px - env(safe-area-inset-bottom));}
    .update-sheet .sheet-foot{bottom:calc(-16px - env(safe-area-inset-bottom));}
    .set-row{font-size:14px; padding:9px 10px;}
    .age-row{padding:8px 10px; gap:8px;}
    .toggle-row{padding:9px 10px;}
    .toggle-row .t-label{font-size:14px;}
    .opt{padding:9px 11px; font-size:14px;}
    .day-total{gap:10px;}
    .wk-head .wk-md{font-size:11.5px;}
    .rt-num{font-size:19px;}
  }
  @media (max-width:360px){
    .now{font-size:11px;}
    .round-btn .disc{width:50px; height:50px;}
    .round-btn .disc svg{width:40px; height:40px;}
    .day-row{grid-template-columns:2.9rem repeat(4,minmax(0,1fr)); font-size:14px;}
    .days-head{grid-template-columns:2.9rem repeat(4,minmax(0,1fr));}
    .month-row{grid-template-columns:5.6rem repeat(3,minmax(0,1fr)); gap:6px;}
    .months-head{grid-template-columns:5.6rem repeat(3,minmax(0,1fr)); gap:6px;}
    .month-row .month-name{font-size:13px;}
    .day-row .dcell .md{font-size:14px;}
    .day-row .dcell .wline{font-size:9.5px;}
    .age-row .age-label{flex-basis:5.4em;}
    .rec-title{font-size:12.5px;}
    .wk-head .wk-md{font-size:10.5px;}
    .wk-sumrow{font-size:11px;}
    .rt-step{width:36px; height:36px;}
    .settings-btn{padding:5px 8px;}
  }
  /* ===== 入力中：キーボードに隠れないよう下方向のスクロール余白を確保 ===== */
  body.kb-open .wrap{padding-bottom:55vh;}
  body.kb-open .sheet{padding-bottom:48vh;}
  body.kb-open .update-sheet{padding-bottom:48vh;}
  /* 入力中は中央ポップアップを上寄せにして、キーボードに隠れないようにする */
  body.kb-open .overlay.center{align-items:flex-start;}
</style>
</head>
<body>
<header class="app-header">
    <p class="now" id="nowLine">—</p>

/* ================= 猫（みぃ・ナリ）の設定 =================
   猫の誕生日と体重履歴（kg・日付つき）は babySettings.cats に持たせ、
   赤ちゃん設定と同じ設定イベントJSONに含めて夫婦で同期する。

function defaultCats(){

function cleanCatWeightLog(arr){

  }
  if(!found) log.push({ d: today, w: w });
  log.sort(function(a,b){ return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });
  if(log.length > 500) log = log.slice(log.length - 500);
  cat.weightLog = log;

var WD = ['日','月','火','水','木','金','土'];
function pad(n){ return (n<10?'0':'') + n; }

function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function fmtTime(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  var min = Math.floor((now - from) / 60000);
  if(min < 0) min = 0;
  if(min < 60) return min + '分前';
  var h = Math.floor(min/60), m = min % 60;
  if(h < 24) return h + '時間' + (m ? m + '分' : '') + '前';
  return Math.floor(h/24) + '日前';
}

/* ================= チャイム（記録成功時のみ） ================= */
var audioCtx = null;
function ensureAudio(){
  try{
    if(!audioCtx){ var AC = window.AudioContext || window.webkitAudioContext; if(AC) audioCtx = new AC(); }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function playChime(){
  if(!audioCtx) return;
  try{
    var freqs = [1318.51, 1567.98, 2093.0];
    var t0 = audioCtx.currentTime + 0.02;
    for(var i=0;i<freqs.length;i++){
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freqs[i];
      var t = t0 + i * 0.09;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.4);
    }
  }catch(e){}
}

/* 次の授乳の目安時刻（前回行の「次 HH:MM」とリマインド予定で共用）。

function getNextFeedDate(){
  var dg = displayGuide();

  var rec = null;
  for(var i=0;i<records.length;i++){ if(KIND[records[i].kind].cat==='feed'){ rec = records[i]; break; } }
  if(!rec) return null;
  var intervalMs = (24 / dg.guide.times) * 3600000 - 30 * 60 * 1000;
  var next = new Date(rec.start.getTime() + intervalMs);
  return new Date(Math.round(next.getTime() / 300000) * 300000);
}

/* 今日のログ：既定は新しい順に直近4件まで（記録とメモを合わせて）。

var todayExpanded = false;
function renderToday(){
  var now = new Date();
  var todays = records.filter(function(r){ return sameDay(r.start, now); });
  var full = todays.slice();
  if(full.length < 4){
    var past = records.filter(function(r){ return !sameDay(r.start, now); });
    full = full.concat(past.slice(0, 5 - full.length));
  }
  var btn = $('todayMoreBtn');
  if(!full.length){
    $('todayList').innerHTML = '<div class="empty">まだ記録がありません</div>';
    if(btn) btn.classList.add('hidden');

  bindRecRows($('todayList'));

/* その日の体重（weightLogの当日分）と前日比。前日の記録が無ければ diff は null */

/* ===== 7日間ログ（統合グリッド） =====

   同じセル内のチップの並びは種類順（おしっこ→うんち→母乳→ミルク→メモ）で固定し、
   同じ種類同士は時刻順。メモは見出しの集計（4種類の数）には数えない。

function wkSumRowHTML(kind, valHTML){

var weekOffset = 0;

  if(archiveRecords){

function renderDays(){

  var endDay = new Date(today); endDay.setDate(endDay.getDate() - weekOffset * 7);

  days.forEach(function(d){

      wkSumRowHTML('milk', st.milk ? String(st.milk) : wkNone()) +
      '</div></div>';
  });
  var slots = {};
  src.forEach(function(r){
    for(var di=0; di<7; di++){
      if(sameDay(r.start, days[di])){
        var key = di*24 + r.start.getHours();
        if(!slots[key]) slots[key] = [];
        slots[key].push(r);
        break;
      }
    }
  });
  var WK_KIND_ORDER = { pee:0, poop:1, breast:2, milk:3, memo:4 };
  Object.keys(slots).forEach(function(k){
    slots[k].sort(function(a,b){
      var dd = (WK_KIND_ORDER[a.kind] || 0) - (WK_KIND_ORDER[b.kind] || 0);
      if(dd) return dd;
      return a.start - b.start;
    });
  });
  for(var h=0; h<24; h++){
    var lastCls = (h===23) ? ' wk-last' : '';
    var nowCls = (isCurrentWeek && h===nowHour) ? ' now-hour' : '';
    html += '<div class="wk-axis' + lastCls + nowCls + '" data-hour="' + h + '">' + h + '</div>';
    for(var c=0; c<7; c++){
      var list = slots[c*24 + h] || [];
      html += '<div class="wk-cell' + lastCls + nowCls + (sameDay(days[c], today) ? ' today-col' : '') + '" data-hour="' + h + '" data-dayts="' + startOfDay(days[c]).getTime() + '">';
      list.forEach(function(r){
        if(r.kind==='milk'){
          html += '<button class="wk-chip milk" type="button" data-eid="' + r.id + '">' + IC.milk + '<span>' + (r.amount||0) + '</span></button>';
        } else {
          html += '<button class="wk-chip ' + r.kind + '" type="button" data-eid="' + r.id + '" aria-label="' + KIND[r.kind].label + '">' + IC[r.kind] + '</button>';
        }
      });
      html += '</div>';
    }
  }
  html += '</div>';
  $('daysBody').innerHTML = html;
  /* 列のどこを押しても、その日を「今日のログ」と同じ一覧で開く
     （月のカレンダーを押したときの日別表示と同じ流れ）。
     一覧の行を押すと記録の編集が開く。チップも直接編集ではなく一覧を開く */

  var chips = $('daysBody').querySelectorAll('.wk-chip');
  for(var j=0;j<chips.length;j++){
    chips[j].addEventListener('click', function(e){
      if(e) e.stopPropagation();

  var colEls = $('daysBody').querySelectorAll('.wk-head[data-dayts], .wk-cell[data-dayts]');
  for(var ci=0; ci<colEls.length; ci++){
    colEls[ci].addEventListener('click', function(){

    });

/* ================= 月間のログ ================= */
/* 集計用データ：アーカイブ（長期取得分）と通常表示分をIDで統合し、通常表示分を優先する */
function logSource(){
  if(!archiveRecords) return records;
  var map = {}, out = [], i;
  for(i=0;i<archiveRecords.length;i++){ map[archiveRecords[i].id] = archiveRecords[i]; }
  for(i=0;i<records.length;i++){ map[records[i].id] = records[i]; }
  for(var k in map){ if(Object.prototype.hasOwnProperty.call(map, k)) out.push(map[k]); }
  out.sort(function(a,b){ return b.start - a.start; });
  return out;
}
function monthStats(y, m){
  var src = logSource();
  var milk = 0, pee = 0, poop = 0, breast = 0, count = 0;
  var firstDay = null;
  src.forEach(function(r){
    if(r.kind==='memo') return;
    if(r.start.getFullYear()===y && r.start.getMonth()===m){
      count++;
      var dd = r.start.getDate();
      if(firstDay === null || dd < firstDay) firstDay = dd;
      if(r.kind==='milk') milk += (r.amount||0);
      else if(r.kind==='pee') pee++;
      else if(r.kind==='poop') poop++;
      else if(r.kind==='breast') breast++;
    }
  });
  var now = new Date();
  var isCurrent = (y===now.getFullYear() && m===now.getMonth());
  var endDay = isCurrent ? now.getDate() : new Date(y, m+1, 0).getDate();
  /* 1日平均の割り算は、その月に初めて記録がある日からにする
     （例：記録が11日からなら、11日から月末まで／今月は今日まで、の日数で割る）。
     体重の表示はこの期間ルールの対象外で、従来どおり */
  var days = endDay;
  if(count && firstDay !== null){
    days = endDay - firstDay + 1;
    if(days < 1) days = 1;
  }
  return {
    count: count,
    milkAvg: count ? Math.round(milk / days) : null,
    diaperAvg: count ? (pee + poop) / days : null,
    peeAvg: count ? pee / days : null,
    poopAvg: count ? poop / days : null,
    breastAvg: count ? breast / days : null
  };
}
function monthWeightRange(y, m){
  var log = babySettings.weightLog || [];
  if(!log.length) return null;
  var startStr = y + '-' + pad(m+1) + '-01';
  var endStr = y + '-' + pad(m+1) + '-' + pad(new Date(y, m+1, 0).getDate());
  var base = null, last = null, firstIn = null;
  for(var i=0;i<log.length;i++){
    var e = log[i];
    if(e.d < startStr) base = e;
    else if(e.d <= endStr){ if(!firstIn) firstIn = e; last = e; }
  }
  if(!last) return null;
  var first = base ? base.w : firstIn.w;
  return { first: first, last: last.w, diff: last.w - first };
}
function fmtWeightRange(y, m){
  var r = monthWeightRange(y, m);
  if(!r) return '―';
  var d = r.diff > 0 ? '+' + r.diff : (r.diff < 0 ? '−' + Math.abs(r.diff) : '±0');
  return r.first.toLocaleString('ja-JP') + ' → ' + r.last.toLocaleString('ja-JP') + '（' + d + '）';
}

function monthRowHTML(y, m){
  var st = monthStats(y, m);
  /* 月間ビューワー：月ごとに体重の変化と4種類の1日平均をシンプルに並べる。
     平均は monthStats の期間ルール（初めて記録がある日から）で計算済み */
  return '<button class="month-view-row" type="button" data-y="' + y + '" data-m="' + m + '">' +

    mvStatHTML('poop', 'うんち', st.poopAvg === null ? '―' : fmtAvg(st.poopAvg) + '回') +

  var hasDay = {};

    if(r.start.getFullYear()===y && r.start.getMonth()===m) hasDay[r.start.getDate()] = true;
  });
  var html = '<div class="cal-head">' +
    '<button class="cal-month" type="button" id="monthTitleBtn">' + y + '年' + (m+1) + '月<span class="chev">›</span></button>' +

  }

  var lastDay = new Date(y, m+1, 0).getDate();
  var today = startOfDay(new Date());
  var isThisMonth = (y === today.getFullYear() && m === today.getMonth());
  var b;
  for(b=0; b<firstDow; b++) html += '<span></span>';
  for(var dn=1; dn<=lastDay; dn++){
    var has = !!hasDay[dn];
    var cls = 'mcal-day' + (has ? ' has' : '') + ((isThisMonth && dn === today.getDate()) ? ' today' : '');
    var inner = dn + '<span class="dot' + (has ? '' : ' none') + '"></span>';
    if(has) html += '<button class="' + cls + '" type="button" data-day="' + dn + '">' + inner + '</button>';
    else html += '<span class="' + cls + '">' + inner + '</span>';
  }
  html += '</div>';
  html += '<div class="month-stats">' +
    mstatHTML('pee', 'おしっこ', fmtAvg(st.peeAvg)) +
    mstatHTML('poop', 'うんち', fmtAvg(st.poopAvg)) +
    mstatHTML('breast', '母乳', fmtAvg(st.breastAvg)) +

      openDay(new Date(y, m, parseInt(this.getAttribute('data-day'), 10)), logSource());

}

function renderAllMonths(){
  var src = logSource();
  var seen = {}, list = [], i;
  for(i=0;i<src.length;i++){
    var r = src[i];
    if(r.kind==='memo') continue;
    var key = r.start.getFullYear() * 12 + r.start.getMonth();
    if(!seen[key]){ seen[key] = true; list.push([r.start.getFullYear(), r.start.getMonth()]); }
  }
  var log = babySettings.weightLog || [];
  for(i=0;i<log.length;i++){
    var p = log[i].d.split('-');
    var y2 = parseInt(p[0], 10), m2 = parseInt(p[1], 10) - 1;
    var key2 = y2 * 12 + m2;
    if(!seen[key2]){ seen[key2] = true; list.push([y2, m2]); }
  }
  list.sort(function(a,b){ return (b[0]*12 + b[1]) - (a[0]*12 + a[1]); });
  if(!list.length){
    $('allMonthsBody').innerHTML = '<div class="empty">まだ記録がありません</div>';
    return;
  }
  $('allMonthsBody').innerHTML = list.map(function(ym){ return monthRowHTML(ym[0], ym[1]); }).join('');
  bindMonthRows($('allMonthsBody'));
}
function openMonth(y, m){
  $('allMonthsOverlay').classList.add('hidden');
  $('monthTitle').textContent = y + '年' + (m+1) + '月';
  var src = logSource();
  var today = startOfDay(new Date());
  var lastDay = new Date(y, m+1, 0).getDate();
  var html = '';
  for(var dn = lastDay; dn >= 1; dn--){
    var d = new Date(y, m, dn);
    if(d.getTime() > today.getTime()) continue;
    html += dayRowHTML(d, dayStatsFrom(src, d));
  }
  $('monthDays').innerHTML = html || '<div class="empty">この月の記録はありません</div>';
  var rows = $('monthDays').querySelectorAll('.day-row');
  for(var i=0;i<rows.length;i++){
    rows[i].addEventListener('click', function(){
      var dd = new Date(parseInt(this.getAttribute('data-day'), 10));
      $('monthOverlay').classList.add('hidden');
      openDay(dd, logSource());
    });
  }
  $('monthOverlay').classList.remove('hidden');
}

function renderBabySummary(){
  var el = $('babySummary');
  var days = ageDays();
  var ageText = '';
  if(days !== null && days >= 0){
    if(days < 365) ageText = '生後' + days + '日';
    else {
      var bAge = parseBirthDate();
      var nowAge = new Date();
      var y = nowAge.getFullYear() - bAge.getFullYear();
      var m = nowAge.getMonth() - bAge.getMonth();
      if(nowAge.getDate() < bAge.getDate()) m--;
      if(m < 0){ y--; m += 12; }
      if(y <= 0){ y = 1; m = 0; }
      if(m >= 12){ y += Math.floor(m/12); m = m % 12; }
      ageText = y + '歳' + (m ? m + 'か月' : '');
    }
  }
  var w = fmtGram(babySettings.weight);
  if(!ageText && !w){
    el.innerHTML = '<span class="unset">赤ちゃん設定を入力</span>';
    renderWeightRecordBtn();
    return;
  }
  var html = '';
  if(ageText) html += '<span class="baby-age">' + ageText + '</span>';
  html += '<span class="baby-weight">体重 ' + (w || '未設定') + '</span>';
  el.innerHTML = html;
  renderWeightRecordBtn();
}

  /* 月齢別一覧：現在の月齢の行には哺乳瓶のおすすめマークを付け、
     設定中の目標と一致する行はハイライトする。タップでその行の
     値（bandGoal）を目標として保存する */
  var curBand = ageBand();
  var curIdx = curBand ? AGE_BANDS.indexOf(curBand) : -1;
  var selIdx = -1;
  if(custom){
    var gb = parseInt(babySettings.goalBand, 10);
    if(!isNaN(gb) && AGE_BANDS[gb]){
      var gbg = bandGoal(AGE_BANDS[gb]);
      if(gbg.ml === custom.ml && gbg.times === custom.times) selIdx = gb;
    }
    if(selIdx < 0){
      for(var si=0; si<AGE_BANDS.length; si++){
        var sbg = bandGoal(AGE_BANDS[si]);
        if(sbg.ml === custom.ml && sbg.times === custom.times){ selIdx = si; break; }
      }
    }
  }
  var tableHtml = AGE_BANDS.map(function(b, idx){
    var rec = (idx === curIdx) ? '<span class="age-rec" role="img" aria-label="おすすめ">' + IC.milk + '</span>' : '';
    var chk = (idx === selIdx) ? '<span class="age-sel" aria-hidden="true">✓</span>' : '';
    return '<button class="age-row' + (idx === selIdx ? ' sel' : '') + '" type="button" data-age-idx="' + idx + '">' +
      '<span class="age-label">' + b.label + '</span><span class="age-value">' + b.disp + '</span>' + rec + chk + '</button>';
  }).join('');
  $('ageTable').innerHTML = tableHtml;
  var ageRows = $('ageTable').querySelectorAll('.age-row');
  for(var ai=0; ai<ageRows.length; ai++){
    ageRows[ai].addEventListener('click', function(){
      var idx = parseInt(this.getAttribute('data-age-idx'), 10);
      var bg = bandGoal(AGE_BANDS[idx]);
      if(!bg) return;
      babySettings.goalMl = bg.ml;
      babySettings.goalTimes = bg.times;
      babySettings.goalBand = idx;
      scheduleBabySave();
    });

function catIconKey(cat){ return (cat && cat.name === 'ナリ') ? 'nari' : 'mii'; }
/* 猫の年齢表示：誕生日（birthDate 'YYYY-MM-DD'）から、赤ちゃんと同じ
   年・月の数え方で「◯歳◯か月」を作る。月が0なら年のみ、1歳未満は
   「◯か月」のみ。誕生日が未設定・不正なら空文字（表示しない） */
function catAgeText(cat){
  var bd = cat && cat.birthDate;
  if(!bd) return '';
  var p = String(bd).split('-');
  if(p.length !== 3) return '';
  var b = new Date(+p[0], +p[1] - 1, +p[2]);
  if(isNaN(b.getTime()) || fmtDateStr(b) !== bd) return '';
  var now = new Date();
  var y = now.getFullYear() - b.getFullYear();
  var m = now.getMonth() - b.getMonth();
  if(now.getDate() < b.getDate()) m--;
  if(m < 0){ y--; m += 12; }
  if(y < 0) return '';
  if(y === 0) return m + 'か月';
  return y + '歳' + (m ? m + 'か月' : '');
}

function applyBabySettings(obj){
  if(!obj || typeof obj !== 'object') return;
  if(typeof obj.birthDate === 'string') babySettings.birthDate = obj.birthDate;
  if(obj.birthWeight !== undefined && obj.birthWeight !== null) babySettings.birthWeight = obj.birthWeight;
  if(obj.weight !== undefined && obj.weight !== null) babySettings.weight = obj.weight;
  if(obj.remind !== undefined) babySettings.remind = !!obj.remind;
  if(obj.goalMl !== undefined && obj.goalMl !== null) babySettings.goalMl = obj.goalMl;
  if(obj.goalTimes !== undefined && obj.goalTimes !== null) babySettings.goalTimes = obj.goalTimes;
  if(obj.goalBand !== undefined && obj.goalBand !== null) babySettings.goalBand = obj.goalBand;
  if(Array.isArray(obj.weightLog)) babySettings.weightLog = cleanWeightLog(obj.weightLog);
  if(Array.isArray(obj.cats)) babySettings.cats = cleanCats(obj.cats);
  saveBabyLocal();
  renderBabyUI();
  /* 相手がリマインドを切り替えた場合も、この端末から予定を追随させる */
  scheduleSyncReminder();
}
function loadBabySettingsFromCal(){
  if(!accessToken) return Promise.resolve();
  var path = '/calendars/' + encodeURIComponent(calendarId) + '/events?q=' +
    encodeURIComponent('赤ちゃん設定') + '&maxResults=20&singleEvents=true';
  return apiFetch(path).then(function(data){
    var items = (data && data.items) || [];
    for(var i=0;i<items.length;i++){
      var ev = items[i];
      var desc = ev.description || '';
      var mi = desc.indexOf(SETTINGS_MARKER);
      if(mi < 0) continue;
      settingsEventId = ev.id;
      settingsEventRaw = ev;
      try{
        var j = JSON.parse(desc.slice(mi + SETTINGS_MARKER.length).split('\n')[0]);
        applyBabySettings(j);
      }catch(e){}
      break;
    }
  }).catch(function(){});
}
function saveBabySettingsToCal(){
  if(!accessToken) return;
  var body;
  if(settingsEventId && settingsEventRaw && settingsEventRaw.start && settingsEventRaw.end){
    body = {
      summary: SETTINGS_TITLE,
      description: SETTINGS_MARKER + JSON.stringify(babySettings),
      start: settingsEventRaw.start,
      end: settingsEventRaw.end
    };
  } else {
    var now = new Date();
    var end = new Date(now.getTime() + 5*60000);
    body = {
      summary: SETTINGS_TITLE,
      description: SETTINGS_MARKER + JSON.stringify(babySettings),
      start: { dateTime: now.toISOString(), timeZone: 'Asia/Tokyo' },
      end: { dateTime: end.toISOString(), timeZone: 'Asia/Tokyo' }
    };
  }
  var path = '/calendars/' + encodeURIComponent(calendarId) + '/events' + (settingsEventId ? '/' + encodeURIComponent(settingsEventId) : '');
  apiFetch(path, { method: settingsEventId ? 'PUT' : 'POST', body: JSON.stringify(body) })
    .then(function(res){
      if(res && res.id){ settingsEventId = res.id; settingsEventRaw = res; }
    }).catch(function(){});
}

/* ================= Google Calendar API ================= */
function apiFetch(path, options){
  options = options || {};
  options.headers = options.headers || {};
  options.headers['Authorization'] = 'Bearer ' + accessToken;
  if(options.body) options.headers['Content-Type'] = 'application/json';
  return fetch('https://www.googleapis.com/calendar/v3' + path, options).then(function(res){
    if(res.status === 401){
      accessToken = null; tokenExpiry = 0;
      updateAuthUI();
      throw new Error('サインインの有効期限が切れました。もう一度サインインしてください。');
    }
    if(!res.ok){
      return res.json().catch(function(){ return {}; }).then(function(j){
        var msg = (j && j.error && j.error.message) ? j.error.message : ('HTTP ' + res.status);
        throw new Error(msg);
      });
    }
    if(res.status === 204) return null;
    return res.json();
  });
}
function markerJSON(kind, amount, text){
  var o = { v:1, kind:kind };
  if(kind==='milk') o.amount = amount;
  if(kind==='memo') o.text = text || '';
  return 'muse-baby-log:' + JSON.stringify(o);
}
function parseEvent(ev){
  if(!ev || !ev.start || !ev.start.dateTime) return null;
  var start = new Date(ev.start.dateTime);
  if(isNaN(start.getTime())) return null;
  var kind = null, amount = 0, text = '';
  var desc = ev.description || '';
  var mi = desc.indexOf('muse-baby-log:');
  if(mi >= 0){
    try{
      var j = JSON.parse(desc.slice(mi + 'muse-baby-log:'.length).split('\n')[0]);
      if(j && j.kind && KIND[j.kind]){ kind = j.kind; amount = j.amount || 0; text = j.text || ''; }
    }catch(e){}
  }
  var title = (ev.summary || '').replace(/\s+/g, ' ').trim();
  if(!kind){
    if(/^メモ/.test(title)){
      kind = 'memo';
      text = title.replace(/^メモ[:：]\s*/, '');
      if(text === title) text = '';
    } else if(/^オムツ[:：]/.test(title)){
      if(title.indexOf('おしっこ') >= 0) kind = 'pee';
      else if(title.indexOf('うんち') >= 0 || title.indexOf('両方') >= 0) kind = 'poop';
    } else if(/^授乳[:：]/.test(title)){
      if(title.indexOf('母乳') >= 0) kind = 'breast';
      else if(title.indexOf('ミルク') >= 0){
        var m = title.match(/(\d+)\s*ml/i);
        kind = 'milk'; amount = m ? parseInt(m[1], 10) : 0;
      }
    }
  }
  if(!kind) return null;
  if(kind==='milk' && !amount){
    var m2 = title.match(/(\d+)\s*ml/i);
    if(m2) amount = parseInt(m2[1], 10);
  }
  return { id: ev.id, start: start, kind: kind, amount: amount, text: text };
}
function eventBody(kind, amount, when, text){
  var end = new Date(when.getTime() + 5*60000);
  return {
    summary: titleOf({kind:kind, amount:amount, text:text}),
    description: markerJSON(kind, amount, text),
    start: { dateTime: when.toISOString(), timeZone: 'Asia/Tokyo' },
    end:   { dateTime: end.toISOString(),  timeZone: 'Asia/Tokyo' }

function loadRecords(silent){

  var qs = '?timeMin=' + encodeURIComponent(from.toISOString()) +

/* ================= ログ用アーカイブ取得（月間集計用・ページネーション） ================= */
var archiveRecords = null;
var archiveSpan = 0;
var archiveFetchedAt = 0;
var archiveLoading = false;
function fetchEventsRange(from, to, maxItems){
  var all = [];
  function page(pageToken){
    var qs = '?timeMin=' + encodeURIComponent(from.toISOString()) +
             '&timeMax=' + encodeURIComponent(to.toISOString()) +
             '&maxResults=250&singleEvents=true&orderBy=startTime' +
             (pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : '');
    return apiFetch('/calendars/' + encodeURIComponent(calendarId) + '/events' + qs).then(function(data){
      var items = (data && data.items) || [];
      for(var i=0;i<items.length;i++){
        var r = parseEvent(items[i]);
        if(r) all.push(r);
      }
      if(data && data.nextPageToken && all.length < maxItems) return page(data.nextPageToken);
      return all;
    });
  }

}

  fetchEventsRange(from, to, 2500).then(function(list){

/* ================= 記録時間ブロック =================
   おむつ・授乳どちらの記録にも効く記録時刻の切り替え。
   ①今：従来どおり現在時刻で記録する。
   ②時間変更：あらかじめ設定した日時に保存する。時間を先に決めてから
   同じ時間で続けて記録する使い方を想定し、記録を保存してもモードと
   設定時刻はそのまま保持する（①今に戻るのは①今を押したときだけ）。
   ②を選んだ時点の現在時刻を初期値とし、時は＋／−で1時間ずつ、
   分は＋／−で10分ずつ（時刻全体が10分前後する）動かす。
   0時を跨ぐと日付も前日・翌日に変わる */
var recTimeMode = 'now'; /* 'now' | 'set' */

/* ================= リマインド（Googleカレンダーの予定＋通知） =================
   リマインドONのときだけ、共有カレンダーに「次の授乳の目安時刻」の予定を
   1件だけ登録する。繰り返し予定にはしない。
   - 記録の追加・編集・削除があったら、すぐには登録せず60秒待ってから
     記録を再読み込みし、リマインド予定を1回だけ登録・上書き更新する。
     続けて記録が入りやすい（母乳のあとにミルク追加、量の直し等）ためで、
     待っている間にまた記録が入ったら、その時点から60秒に数え直す
     （デバウンス）。画面表示のための読み込みはすぐに行うが、その際の
     リマインド同期は行わない。30秒ごとの自動更新・フォーカス時の
     読み込みでも、待機中はリマインド同期を先行させない
   - アプリを開いたとき・フォーカス時の追いつき同期は従来どおり即時に行う
     （待機中のデバウンスが無い場合）。待機中にアプリを閉じた場合は、
     次に開いたときの同期で登録される
   - 既に未来のリマインド予定がある場合は、消して作り直さず、その予定を
     新しい目安時刻へ更新（PUT）する。予定が無い場合だけ新規作成する。
     重複した未来の予定があれば、残す1件以外を消す
   - 予定には時刻ちょうど（0分前）のポップアップ通知を付ける
   - OFFにしたら登録済みの予定も消す（トグルの切り替えは待たずに即時）
   - タイトルとマーカーを記録と区別し、parseEventでは記録として数えない */
var REMIND_TITLE = 'リマインド：次の授乳の目安';
var REMIND_MARKER = 'muse-baby-remind:';
var REMIND_DEBOUNCE_MS = 60000;
var remindSyncing = false;
var remindSyncQueued = false;
var remindSyncTimer = null;
var remindDebounceTimer = null;
var remindDebouncePending = false;
function scheduleSyncReminder(){
  /* 記録変更後の60秒デバウンス待機中は、自動更新・フォーカス・設定同期
     などからの同期で先に登録しない。登録はデバウンス満了時の1回だけ */
  if(remindDebouncePending) return;
  if(remindSyncTimer) clearTimeout(remindSyncTimer);
  remindSyncTimer = setTimeout(function(){
    remindSyncTimer = null;
    syncReminder();
  }, 800);
}
/* 記録の追加・編集・削除のたびに呼ぶ：その時点から60秒数え直し、
   満了したら記録を再読み込みしてからリマインド予定を1回だけ同期する */
function scheduleDelayedReminderSync(){
  remindDebouncePending = true;
  if(remindSyncTimer){ clearTimeout(remindSyncTimer); remindSyncTimer = null; }
  if(remindDebounceTimer) clearTimeout(remindDebounceTimer);
  remindDebounceTimer = setTimeout(function(){
    remindDebounceTimer = null;
    remindDebouncePending = false;
    /* 最新の記録を読み込み直してから同期する（loadRecords完了後に
       scheduleSyncReminder経由で1回だけ同期される） */
    loadRecords(true);
  }, REMIND_DEBOUNCE_MS);
}
function cancelDelayedReminderSync(){
  if(remindDebounceTimer){ clearTimeout(remindDebounceTimer); remindDebounceTimer = null; }
  remindDebouncePending = false;
}
function isReminderEvent(ev){
  if(!ev) return false;
  var desc = ev.description || '';
  if(desc.indexOf(REMIND_MARKER) >= 0) return true;
  return (ev.summary || '') === REMIND_TITLE;
}
function fetchReminderEvents(){
  var now = new Date();
  var from = startOfDay(now); from.setDate(from.getDate() - 2);
  var to = startOfDay(now); to.setDate(to.getDate() + 3);
  var qs = '?timeMin=' + encodeURIComponent(from.toISOString()) +
           '&timeMax=' + encodeURIComponent(to.toISOString()) +
           '&maxResults=250&singleEvents=true&orderBy=startTime';
  return apiFetch('/calendars/' + encodeURIComponent(calendarId) + '/events' + qs)
    .then(function(data){
      var items = (data && data.items) || [];
      var out = [];
      for(var i=0;i<items.length;i++){
        var ev = items[i];
        if(!isReminderEvent(ev) || !ev.start || !ev.start.dateTime) continue;
        var st = new Date(ev.start.dateTime);
        if(!isNaN(st.getTime())) out.push({ id: ev.id, start: st });
      }
      return out;
    });
}
function deleteReminderEvent(id){
  return apiFetch('/calendars/' + encodeURIComponent(calendarId) + '/events/' + encodeURIComponent(id), {
    method: 'DELETE'
  }).catch(function(){});
}
function reminderEventBody(when){
  var end = new Date(when.getTime() + 30*60000);
  return {
    summary: REMIND_TITLE,
    description: REMIND_MARKER + JSON.stringify({ v:1, target: when.toISOString() }),
    start: { dateTime: when.toISOString(), timeZone: 'Asia/Tokyo' },
    end:   { dateTime: end.toISOString(),  timeZone: 'Asia/Tokyo' },
    reminders: { useDefault: false, overrides: [ { method: 'popup', minutes: 0 } ] }
  };
}
function createReminderEvent(when){
  return apiFetch('/calendars/' + encodeURIComponent(calendarId) + '/events', {
    method: 'POST', body: JSON.stringify(reminderEventBody(when))
  });
}
/* 既存のリマインド予定を新しい目安時刻へ上書き更新する。
   更新対象が消えていた等で更新できなければ、新規作成に切り替える */
function updateReminderEvent(id, when){
  return apiFetch('/calendars/' + encodeURIComponent(calendarId) + '/events/' + encodeURIComponent(id), {
    method: 'PUT', body: JSON.stringify(reminderEventBody(when))
  }).catch(function(){
    return createReminderEvent(when);
  });
}
function syncReminder(){
  if(!accessToken) return Promise.resolve();
  /* ONのときは目安時刻の計算に記録が必要なので、初回読み込み前は見送る
     （読み込み完了後に loadRecords 側から改めて呼ばれる） */
  if(babySettings.remind && !recordsLoaded) return Promise.resolve();
  if(remindSyncing){ remindSyncQueued = true; return Promise.resolve(); }
  remindSyncing = true;
  return fetchReminderEvents().then(function(list){
    var nowMs = Date.now();
    /* まだ時刻が来ていない予定だけが差し替え・削除の対象 */
    var futures = list.filter(function(r){ return r.start.getTime() > nowMs; });
    var chain = Promise.resolve();
    function delAll(arr){
      arr.forEach(function(r){
        chain = chain.then(function(){ return deleteReminderEvent(r.id); });
      });
    }
    if(!babySettings.remind){
      delAll(futures);
      return chain;
    }
    var target = getNextFeedDate();
    if(!target || target.getTime() <= nowMs){
      /* 目安が無い／既に過ぎている場合は新しい予定を作らず、残っている未来の予定を消す */
      delAll(futures);
      return chain;
    }
    /* 予定ありの場合は更新する：残す1件（同じ時刻の予定があればそれ、
       無ければ最も近い未来の予定）を新しい目安時刻へ上書き更新し、
       余分な未来の予定だけ消す。予定が無ければ新規作成する。
       これにより、授乳を記録するたびに通知はその記録起点の時刻へ移る */
    futures.sort(function(a,b){ return a.start - b.start; });
    var keeper = null;
    futures.forEach(function(r){
      if(!keeper && Math.abs(r.start.getTime() - target.getTime()) < 60000) keeper = r;
    });
    if(!keeper && futures.length) keeper = futures[0];
    if(keeper){
      delAll(futures.filter(function(r){ return r.id !== keeper.id; }));
      return chain.then(function(){ return updateReminderEvent(keeper.id, target); });
    }
    return chain.then(function(){ return createReminderEvent(target); });
  }).catch(function(){
  }).then(function(){
    remindSyncing = false;
    if(remindSyncQueued){ remindSyncQueued = false; syncReminder(); }
  });
}

/* ================= 認証（Google Identity Services） ================= */
function updateAuthUI(){
  var signedIn = !!accessToken && Date.now() < tokenExpiry;
  $('signedBox').classList.toggle('hidden', !signedIn);
  $('signinBtn').classList.toggle('hidden', signedIn || !clientId);
  /* サインインボタンが隠れているときはトップバー自体を畳む（サインイン中表示はページ最下部） */
  $('topbar').style.display = (signedIn || !clientId) ? 'none' : '';
  $('reloadBtn').classList.toggle('hidden', !signedIn);
  $('signoutBtn').classList.toggle('hidden', !signedIn);
  setBusy(busy);
}
var sessionRestored = false;
function persistSession(){
  if(!accessToken) return;
  try{
    localStorage.setItem(LS_TOKEN, accessToken);
    localStorage.setItem(LS_TOKEN_EXPIRY, String(tokenExpiry));
    localStorage.setItem(LS_AUTO, '1');
  }catch(e){}
}
function clearSession(){
  try{
    localStorage.removeItem(LS_TOKEN);
    localStorage.removeItem(LS_TOKEN_EXPIRY);
    localStorage.removeItem(LS_AUTO);
  }catch(e){}
}
/* ============ サイレント再取得：先行更新と再試行 ============ */
function tokenValid(){
  return !!accessToken && Date.now() < tokenExpiry;
}
/* 期限切れ、または期限までの残りが REFRESH_MARGIN_MS 以下なら更新対象 */
function tokenNeedsRefresh(){
  if(!tokenValid()) return true;
  return (tokenExpiry - Date.now()) <= REFRESH_MARGIN_MS;
}
function resetSilentRetry(){
  silentRetryCount = 0;
  silentGaveUp = false;
  if(silentRetryTimer){ clearTimeout(silentRetryTimer); silentRetryTimer = null; }
}
/* サイレント再取得を1回試みる（実行中・再試行待ち・打ち切り後は除く）。
   手動サインインなど認証が実行中（authInFlight）のときも新たに送らず、
   実行中のリクエストに寄せる */
function requestSilentToken(){
  if(authInFlight || silentInFlight || silentGaveUp || silentRetryTimer) return;
  if(!tokenClient && !initTokenClient()) return;
  if(authInFlight) return;
  authInFlight = true;
  silentInFlight = true;
  silentAuth = true;
  try{
    tokenClient.requestAccessToken({prompt:''});
  }catch(e){
    authInFlight = false;
    silentInFlight = false;
    silentAuth = false;
    onSilentAuthFailure();
  }
}
/* サイレント再取得が失敗したとき：すぐにはサインインへ落とさず、
   間隔を置いて数回まで自動で再試行する。再試行を使い切り、
   なおトークンが切れている場合に限り従来どおりサインインを求める */
function onSilentAuthFailure(){
  authInFlight = false;
  silentInFlight = false;
  if(silentRetryTimer) return;
  if(silentRetryCount < SILENT_RETRY_DELAYS.length){
    var delay = SILENT_RETRY_DELAYS[silentRetryCount];
    silentRetryCount++;
    silentRetryTimer = setTimeout(function(){
      silentRetryTimer = null;
      /* 非表示のまま失敗が続いた分は、復帰時の autoRefresh に任せる */
      if(document.hidden) return;
      requestSilentToken();
    }, delay);
    return;
  }
  if(!tokenValid()){
    accessToken = null; tokenExpiry = 0;
    silentGaveUp = true;
    updateAuthUI();
  }
}
function restoreSession(){
  if(sessionRestored) return;
  sessionRestored = true;
  var savedToken = '', savedExpiry = 0, auto = '';
  try{
    savedToken = localStorage.getItem(LS_TOKEN) || '';
    savedExpiry = parseInt(localStorage.getItem(LS_TOKEN_EXPIRY) || '0', 10) || 0;
    auto = localStorage.getItem(LS_AUTO) || '';
  }catch(e){}
  if(savedToken && savedExpiry && Date.now() < savedExpiry){
    accessToken = savedToken;
    tokenExpiry = savedExpiry;
    updateAuthUI();
    loadRecords(true);
    loadBabySettingsFromCal();
    return;
  }
  if(auto === '1' && tokenClient){
    requestSilentToken();
  }
}
function initTokenClient(){
  if(!clientId || !window.google || !google.accounts || !google.accounts.oauth2) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: 'https://www.googleapis.com/auth/calendar.events',
    callback: function(resp){
      var wasSilent = silentAuth;
      silentAuth = false;
      silentInFlight = false;
      authInFlight = false;
      if(resp && resp.access_token){
        resetSilentRetry();
        accessToken = resp.access_token;
        tokenExpiry = Date.now() + (parseInt(resp.expires_in, 10) || 3600) * 1000 - 60000;
        persistSession();
        updateAuthUI();
        loadRecords(wasSilent);
        loadBabySettingsFromCal();
      } else if(wasSilent){
        onSilentAuthFailure();
      } else {
        setStatus('サインインできませんでした', true);
      }
    },
    error_callback: function(err){
      if(silentAuth){ silentAuth = false; silentInFlight = false; authInFlight = false; onSilentAuthFailure(); return; }
      authInFlight = false;
      setStatus('サインインでエラーが発生しました' + (err && err.message ? '：' + err.message : ''), true);
    }
  });
  return true;
}
function signIn(){
  ensureAudio();
  /* 認証が既に実行中なら新たに送らない（ボタン連打・自動再取得との重なり防止）。
     実行中のリクエストに寄せ、処理中であることだけを一時表示する */
  if(authInFlight || silentInFlight){
    setStatus('サインイン処理中です。画面が変わるまでお待ちください');
    return;
  }
  resetSilentRetry();
  if(!clientId){
    openBabySettings();
    return;
  }
  if(!tokenClient && !initTokenClient()){
    setStatus('Googleの準備中です。数秒待ってからもう一度押してください', true);
    /* 準備待ちの間も認証実行中として扱い、この間に自動再取得や
       再度のサインインが重なって送られないようにする */
    authInFlight = true;
    var tries = 0;
    var iv = setInterval(function(){
      tries++;
      if(initTokenClient()){
        clearInterval(iv);
        silentAuth = false;
        setStatus('サインイン処理中です。画面が変わるまでお待ちください');
        try{
          tokenClient.requestAccessToken({prompt:''});
        }catch(e){
          authInFlight = false;
          setStatus('サインインでエラーが発生しました' + (e && e.message ? '：' + e.message : ''), true);
        }
      }
      else if(tries > 20){ clearInterval(iv); authInFlight = false; setStatus('Googleに接続できませんでした。通信環境を確認してください', true); }
    }, 500);
    return;
  }
  authInFlight = true;
  silentAuth = false;
  setStatus('サインイン処理中です。画面が変わるまでお待ちください');
  try{
    tokenClient.requestAccessToken({ prompt: '' });
  }catch(e){
    authInFlight = false;
    setStatus('サインインでエラーが発生しました' + (e && e.message ? '：' + e.message : ''), true);
  }
}

/* ================= 入力欄をキーボードの上に見せる =================
   すべての入力欄（テキスト・数値・日付）共通の処理。フォーカスした入力欄と、
   同じ編集エリア内にある保存・キャンセルボタンが、ソフトウェアキーボードの
   上に見える位置までスクロールする。キーボードの表示には時間がかかることが
   あるため、フォーカス直後だけでなく時間差で何度か合わせ直し、
   visualViewport の変化（キーボードの開閉）にも追随する。
   スクロールは縦方向のみで、横スクロール・横ぶれは出さない */
var kbInput = null;
var kbTimers = [];
function kbClearTimers(){
  for(var i=0;i<kbTimers.length;i++) clearTimeout(kbTimers[i]);
  kbTimers = [];
}
/* 入力欄と一緒に見せたい範囲：同じ編集エリア（保存・キャンセル含む） */
function kbBlockOf(el){
  if(el.closest){
    var b = el.closest('.pop-sheet, .sheet, .milk-custom, .edit-fields');
    if(b) return b;
  }
  return el;
}
function kbEnsureVisible(){
  var el = kbInput;
  if(!el || document.activeElement !== el) return;
  var vv = window.visualViewport;
  var vTop = vv ? vv.offsetTop : 0;
  var vBottom = vv ? (vv.offsetTop + vv.height) : window.innerHeight;
  var margin = 14;
  var rect = kbBlockOf(el).getBoundingClientRect();
  /* エリア全体が見える高さに収まらないときは入力欄自体を優先する */
  if(rect.height > (vBottom - vTop) - margin * 2) rect = el.getBoundingClientRect();
  var delta = 0;
  if(rect.bottom > vBottom - margin) delta = rect.bottom - (vBottom - margin);
  else if(rect.top < vTop + margin) delta = rect.top - (vTop + margin);
  if(!delta) return;
  var rest = delta;
  var sheet = el.closest ? el.closest('.sheet, .pop-sheet, .update-sheet') : null;
  if(sheet){
    var before = sheet.scrollTop;
    sheet.scrollTop = before + rest;
    rest -= (sheet.scrollTop - before);
  }
  if(rest) window.scrollBy(0, rest);
}
function kbSchedule(){
  kbClearTimers();
  var delays = [80, 300, 600, 1000, 1500];
  for(var i=0;i<delays.length;i++) kbTimers.push(setTimeout(kbEnsureVisible, delays[i]));
}

  /* 日付・時刻欄（生年月日・猫の誕生日・編集の日付と時刻など）は、ユーザーが
     欄をタップしてフォーカスしたときにだけピッカーを開く。編集ポップアップは
     開いた時点でフォーカスを移さないので、開いただけではピッカーは出ない */
  if(t.type === 'date' || t.type === 'time' || t.type === 'datetime-local'){ try{ if(t.showPicker) t.showPicker(); }catch(err){} }
  kbInput = t;
  document.body.classList.add('kb-open');
  kbSchedule();
});
document.addEventListener('focusout', function(){
  setTimeout(function(){
    var a = document.activeElement;
    if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return;

function unseenNotes(seen){
  var start = 0, i, j;
  for(i=0;i<CHANGELOG.length;i++){
    if(CHANGELOG[i].version === seen){ start = i + 1; break; }
  }
  var out = [];
  for(i=start;i<CHANGELOG.length;i++){
    for(j=0;j<CHANGELOG[i].notes.length;j++) out.push(CHANGELOG[i].notes[j]);

function checkUpdateNotice(){
  var seen = getSeenVersion();
  /* 初回（保存された版が無い端末）は「まだ何も見ていない」扱いにし、
     変更履歴の全件を1回だけ表示する。閉じたら現在の版が保存される */
  if(seen === APP_VERSION) return;
  var notes = unseenNotes(seen);
  if(!notes.length){ saveSeenVersion(); return; }
  /* 新しい変更をカテゴリごとにまとめ、出てきた順に区切って並べる */
  var order = [], groups = {};
  notes.forEach(function(n){
    var c = (n && n.c) || 'その他';
    if(!groups[c]){ groups[c] = []; order.push(c); }
    groups[c].push(n && n.t ? n.t : String(n));
  });
  var html = '';
  order.forEach(function(c){
    var meta = UPD_CATS[c] || UPD_CATS['表示'];
    html += '<div class="upd-cat"><div class="upd-cat-head"><span class="upd-cat-ic" style="background:' + meta.bg + ';color:' + meta.fg + ';">' + meta.icon + '</span>' + escHTML(c) + '</div><ul class="upd-list">';
    groups[c].forEach(function(t){ html += '<li>' + escHTML(t) + '</li>'; });
    html += '</ul></div>';
  });
  $('updateNotes').innerHTML = html;
  $('updateOverlay').classList.remove('hidden');
}
$('updateCloseBtn').addEventListener('click', closeUpdateNotice);
$('updateOverlay').addEventListener('click', function(e){ if(e.target===this) closeUpdateNotice(); });

/* ================= 記録ボタンの押し心地アニメーション ================= */
document.addEventListener('click', function(ev){
  var t = ev.target;
  if(!t || !t.closest) return;
  var btn = t.closest('.round-btn, .weight-edit');
  if(!btn) return;
  var target = btn.classList.contains('round-btn') ? btn.querySelector('.disc') : btn;
  if(!target) return;
  target.classList.remove('anim-pop');
  void target.offsetWidth;
  target.classList.add('anim-pop');
});

/* ================= 初期化 ================= */
checkUpdateNotice();
setNowLine();
renderRecTime();
renderBabyUI();
updateAuthUI();
window.addEventListener('load', function(){
  if(clientId){
    var tries = 0;
    var iv = setInterval(function(){
      tries++;
      if(initTokenClient()){ clearInterval(iv); restoreSession(); }
      else if(tries > 20) clearInterval(iv);
    }, 500);
  }
});
document.addEventListener('pointerdown', ensureAudio, { once:false });
})();
</script>
